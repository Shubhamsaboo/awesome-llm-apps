[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shennong-mi"
version = "0.1.0"
description = "神农觅 (Shennong觅) — AI-Powered TCM Knowledge Navigator: Neo4j + LangGraph + LLM"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Happy-Chen-CH", email = "19867713117@163.com" },
]
keywords = [
    "chinese-medicine",
    "knowledge-graph",
    "neo4j",
    "langgraph",
    "llm",
    "traditional-chinese-medicine",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# ============================================================
# 核心依赖
# ============================================================
dependencies = [
    # —— Web 框架与界面 ——
    "streamlit>=1.33.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "playwright>=1.40.0",

    # —— 数据处理与分析 ——
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",

    # —— 图数据库 ——
    "neo4j>=5.17.0",

    # —— AI / LLM ——
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.5",
    "openai>=1.12.0",
    "langgraph>=0.2.0",

    # —— 向量检索与 Embedding ——
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.3.0",

    # —— 中文分词 ——
    "jieba>=0.42.0",

    # —— 文本分类 ——
    "fasttext>=0.9.2",

    # —— 深度学习 ——
    "torch>=2.0.0",

    # —— HuggingFace 生态 ——
    "transformers>=4.36.0",
    "peft>=0.7.0",
    "datasets>=2.16.0",
    "scikit-learn>=1.3.0",

    # —— 工具 ——
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",

    # —— 类型提示 ——
    "typing-extensions>=4.9.0",

    # —— 云服务 / SDK ——
    "volcengine>=1.0.0",

    # —— 数据建模 ——
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# 开发与测试
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/Happy-Chen-CH/ShenNongMi"
Repository = "https://github.com/Happy-Chen-CH/ShenNongMi.git"
Issues = "https://github.com/Happy-Chen-CH/ShenNongMi/issues"

# ============================================================
# uv 依赖组（可选，用于本地开发）
# ============================================================
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

# ============================================================
# setuptools 包发现配置
# ============================================================
[tool.setuptools]
packages = [
    "common",
    "__001__clawler",
    "__002__extract_information",
    "__003__create_neo4j_database",
    "__004__langgraph_more_nodes",
    "__004__langgraph_more_nodes.node",
    "__005__fastapi",
    "__006__streamlit",
    "__006__streamlit.pages",
    "__006__streamlit.utils",
    "__007__fine_tune",
    "__007__fine_tune.fasttext_xiaohongshu_recognition",
    "__007__fine_tune.chineserobertawwmext_zhongyi_recognition",
    "__007__fine_tune.intent_recognition_data",
]

# ============================================================
# 工具配置
# ============================================================

[tool.pytest.ini_options]
testpaths = ["__004__langgraph_more_nodes"]
python_files = ["*_test.py", "test_*.py", "*langgraph_more_nodes.py"]

[tool.uv]
# uv 在同步依赖时自动创建 .venv
managed = true
