  <script>
    /* =========================================================================
     * EXCALIFLOW — ZERO-DEPENDENCY HAND-DRAWN DIAGRAMMING & 60FPS FLOW ENGINE
     * ========================================================================= */

    const SEMANTIC_COLORS = [
      { hex: '#171717', name: 'Carbon', lightFill: 'rgba(23, 23, 23, 0.07)', darkFill: 'rgba(248, 250, 252, 0.14)', darkStroke: '#f8fafc' },
      { hex: '#0070f3', name: 'Blue',   lightFill: 'rgba(0, 112, 243, 0.12)', darkFill: 'rgba(56, 189, 248, 0.20)', darkStroke: '#38bdf8' },
      { hex: '#7928ca', name: 'Purple', lightFill: 'rgba(121, 40, 202, 0.12)', darkFill: 'rgba(192, 132, 252, 0.22)', darkStroke: '#c084fc' },
      { hex: '#10b981', name: 'Emerald',lightFill: 'rgba(16, 185, 129, 0.13)', darkFill: 'rgba(52, 211, 153, 0.20)', darkStroke: '#34d399' },
      { hex: '#f59e0b', name: 'Amber',  lightFill: 'rgba(245, 158, 11, 0.15)', darkFill: 'rgba(251, 191, 36, 0.22)', darkStroke: '#fbbf24' },
      { hex: '#ef4444', name: 'Rose',   lightFill: 'rgba(239, 68, 68, 0.13)',  darkFill: 'rgba(248, 113, 113, 0.22)', darkStroke: '#f87171' },
      { hex: '#06b6d4', name: 'Cyan',   lightFill: 'rgba(6, 182, 212, 0.14)',  darkFill: 'rgba(34, 211, 238, 0.22)', darkStroke: '#22d3ee' }
    ];

    // Matches Excalidraw's FONT_FAMILY (Excalifont / Virgil for hand, Assistant / Nunito for normal, Cascadia for code)
    const FONT_MAP = {
      hand: "'Excalifont', 'Virgil', 'Patrick Hand', 'Architects Daughter', 'Caveat', cursive",
      sans: "'Assistant', 'Nunito', 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif",
      code: "'Cascadia', 'Geist Mono', monospace"
    };

    // Excalidraw unitless line-height metric from packages/common/src/font-metadata.ts
    const EXCALIDRAW_LINE_HEIGHT = 1.25;

    function normalizeFontFamily(family) {
      if (!family) return 'hand';
      if (typeof family === 'number') {
        if (family === 3 || family === 8) return 'code';
        if (family === 2 || family === 4 || family === 6 || family === 9 || family === 10) return 'sans';
        return 'hand';
      }
      const f = String(family).toLowerCase();
      if (f === 'hand' || f.includes('excalifont') || f.includes('virgil') || f.includes('patrick') || f.includes('caveat')) return 'hand';
      if (f === 'sans' || f === 'normal' || f.includes('assistant') || f.includes('nunito') || (f.includes('geist') && !f.includes('mono')) || f.includes('inter')) return 'sans';
      if (f === 'code' || f === 'mono' || f.includes('cascadia') || f.includes('mono')) return 'code';
      return 'hand';
    }

    function getFontCss(family, fontSize, weight = null) {
      const key = normalizeFontFamily(family);
      const cssFamily = FONT_MAP[key] || FONT_MAP.hand;
      const sz = Number(fontSize) || 16;
      const resolvedWeight = weight !== null ? weight : (key === 'hand' ? 400 : 500);
      return `${resolvedWeight} ${sz}px ${cssFamily}`;
    }

    function getColorEntry(hex) {
      const norm = (hex || '#171717').toLowerCase();
      return SEMANTIC_COLORS.find(c => c.hex.toLowerCase() === norm) || SEMANTIC_COLORS[0];
    }

    function resolveStrokeColor(hex, canvasBg) {
      const entry = getColorEntry(hex);
      const isDark = (canvasBg || state.canvasBg) === '#000000';
      if (isDark) return entry.darkStroke || entry.hex;
      return entry.hex;
    }

    function resolveFillTint(hex, canvasBg, isSticky = false) {
      const entry = getColorEntry(hex);
      const isDark = (canvasBg || state.canvasBg) === '#000000';
      if (isSticky) {
        if (entry.hex === '#171717') return isDark ? 'rgba(251, 191, 36, 0.20)' : '#fef3c7';
      }
      return isDark ? entry.darkFill : entry.lightFill;
    }

    /* -------------------------------------------------------------------------
     * 1. Deterministic Seeded PRNG (mulberry32)
     * ------------------------------------------------------------------------- */
    function mulberry32(seed) {
      let a = (Number(seed) || 1) >>> 0;
      return function () {
        a |= 0;
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    let idCounter = 1000;
    function nextId(prefix = 'el') {
      idCounter += 1;
      return `${prefix}_${idCounter}_${Math.floor(Math.random() * 9000 + 1000)}`;
    }

    /* -------------------------------------------------------------------------
     * 2. Scene State
     * ------------------------------------------------------------------------- */
    const state = {
      elements: [],
      selectedIds: new Set(),
      hoveredId: null,
      hoveredPort: null,
      hoveredArrowHandle: null,
      hoveredResizeHandle: null,
      splitTargetArrowId: null,
      snapPreview: null,
      activeTool: 'select',
      toolLocked: false,
      canvasBg: '#ffffff',
      scrollX: 0,
      scrollY: 0,
      zoom: 1,
      flowEnabled: true,
      flowMode: 'comets',
      flowSpeed: 1.0,
      activePulses: [],
      laserPoints: [],
      nodeArrivalEnergy: new Map(),
      defaults: {
        strokeColor: '#171717',
        fillStyle: 'hachure',
        fontFamily: 'hand',
        fontSize: 15,
        roughness: 0.85,
        strokeWidth: 2.2,
        strokeStyle: 'solid',
        curveType: 'curved'
      },
      history: {
        undoStack: [],
        redoStack: []
      },
      clipboard: [],
      pasteCount: 0,
      drag: null,
      editingId: null,
      isSpacePanning: false
    };

    /* -------------------------------------------------------------------------
     * 3. Zero-Bleed Analytical Interior Clipping & Procedural Sketch Engine
     * ------------------------------------------------------------------------- */
    function clampPointToShapeInterior(el, px, py, inset = 1.5) {
      const w = Math.max(2, el.width || 0);
      const h = Math.max(2, el.height || 0);
      const cx = el.x + w / 2;
      const cy = el.y + h / 2;
      const ins = Math.min(Math.max(0, inset), Math.min(w, h) * 0.35);

      if (el.type === 'ellipse') {
        const rx = Math.max(1, w / 2 - ins);
        const ry = Math.max(1, h / 2 - ins);
        const ux = (px - cx) / rx;
        const vy = (py - cy) / ry;
        const d2 = ux * ux + vy * vy;
        if (d2 > 0.999) {
          const s = 0.995 / Math.sqrt(d2);
          return [cx + (px - cx) * s, cy + (py - cy) * s];
        }
        return [px, py];
      }

      if (el.type === 'diamond') {
        const hw = Math.max(1, w / 2 - ins);
        const hh = Math.max(1, h / 2 - ins);
        const l1 = Math.abs(px - cx) / hw + Math.abs(py - cy) / hh;
        if (l1 > 0.999) {
          const s = 0.995 / l1;
          return [cx + (px - cx) * s, cy + (py - cy) * s];
        }
        return [px, py];
      }

      const xL = el.x + ins;
      const xR = el.x + w - ins;
      const yT = el.y + ins;
      const yB = el.y + h - ins;
      let nx = Math.max(xL, Math.min(xR, px));
      let ny = Math.max(yT, Math.min(yB, py));
      const r = Math.max(0, Math.min(14, w / 4, h / 4) - ins * 0.5);
      if (r > 0.5) {
        const corners = [
          [xL + r, yT + r, nx < xL + r && ny < yT + r],
          [xR - r, yT + r, nx > xR - r && ny < yT + r],
          [xR - r, yB - r, nx > xR - r && ny > yB - r],
          [xL + r, yB - r, nx < xL + r && ny > yB - r]
        ];
        for (const [kx, ky, inCorner] of corners) {
          if (inCorner) {
            const dx = nx - kx;
            const dy = ny - ky;
            const d = Math.hypot(dx, dy);
            if (d > r * 0.995) {
              const s = (r * 0.99) / d;
              nx = kx + dx * s;
              ny = ky + dy * s;
            }
          }
        }
      }
      return [nx, ny];
    }

    function clipSegmentToShape(el, x1, y1, x2, y2, inset = 1.8) {
      if (!el) return null;
      const w = Number(el.width) || 0;
      const h = Number(el.height) || 0;
      if (w <= 2 || h <= 2) return null;

      const cx = el.x + w / 2;
      const cy = el.y + h / 2;
      const ins = Math.min(Math.max(0, Number(inset) || 0), Math.min(w, h) * 0.35);
      const dx = x2 - x1;
      const dy = y2 - y1;

      if (el.type === 'ellipse') {
        const rx = Math.max(1, w / 2 - ins);
        const ry = Math.max(1, h / 2 - ins);
        const u1 = (x1 - cx) / rx;
        const v1 = (y1 - cy) / ry;
        const du = dx / rx;
        const dv = dy / ry;

        const A = du * du + dv * dv;
        const B = 2 * (u1 * du + v1 * dv);
        const C = u1 * u1 + v1 * v1 - 1;

        if (A < 1e-12) {
          return C <= 0 ? [x1, y1, x2, y2] : null;
        }
        const disc = B * B - 4 * A * C;
        if (disc <= 0) return null;

        const sqrtD = Math.sqrt(disc);
        const t0 = (-B - sqrtD) / (2 * A);
        const t1 = (-B + sqrtD) / (2 * A);
        const tMin = Math.max(0, Math.min(t0, t1));
        const tMax = Math.min(1, Math.max(t0, t1));
        if (tMin >= tMax - 1e-5) return null;

        const [cx1, cy1] = clampPointToShapeInterior(el, x1 + tMin * dx, y1 + tMin * dy, ins);
        const [cx2, cy2] = clampPointToShapeInterior(el, x1 + tMax * dx, y1 + tMax * dy, ins);
        return [cx1, cy1, cx2, cy2];
      }

      if (el.type === 'diamond') {
        const hw = Math.max(1, w / 2 - ins);
        const hh = Math.max(1, h / 2 - ins);
        let tMin = 0;
        let tMax = 1;

        const signs = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
        for (let i = 0; i < 4; i++) {
          const sx = signs[i][0];
          const sy = signs[i][1];
          const p = sx * (dx / hw) + sy * (dy / hh);
          const q = 1 - (sx * ((x1 - cx) / hw) + sy * ((y1 - cy) / hh));
          if (Math.abs(p) < 1e-12) {
            if (q < 0) return null;
          } else if (p > 0) {
            tMax = Math.min(tMax, q / p);
          } else {
            tMin = Math.max(tMin, q / p);
          }
          if (tMin >= tMax - 1e-5) return null;
        }

        const [cx1, cy1] = clampPointToShapeInterior(el, x1 + tMin * dx, y1 + tMin * dy, ins);
        const [cx2, cy2] = clampPointToShapeInterior(el, x1 + tMax * dx, y1 + tMax * dy, ins);
        return [cx1, cy1, cx2, cy2];
      }

      const xL = el.x + ins;
      const xR = el.x + w - ins;
      const yT = el.y + ins;
      const yB = el.y + h - ins;
      if (xL >= xR || yT >= yB) return null;

      let tMin = 0;
      let tMax = 1;
      const pArr = [-dx, dx, -dy, dy];
      const qArr = [x1 - xL, xR - x1, y1 - yT, yB - y1];
      for (let i = 0; i < 4; i++) {
        const p = pArr[i];
        const q = qArr[i];
        if (Math.abs(p) < 1e-12) {
          if (q < 0) return null;
        } else {
          const r = q / p;
          if (p < 0) tMin = Math.max(tMin, r);
          else tMax = Math.min(tMax, r);
          if (tMin >= tMax - 1e-5) return null;
        }
      }

      const r = el.type === 'sticky' ? 4 : Math.max(0, Math.min(14, w / 4, h / 4) - ins * 0.5);
      if (r > 0.5) {
        const clipCornerCircle = (tVal, isStart) => {
          const px = x1 + tVal * dx;
          const py = y1 + tVal * dy;
          let kx = null;
          let ky = null;
          if (px < xL + r && py < yT + r) { kx = xL + r; ky = yT + r; }
          else if (px > xR - r && py < yT + r) { kx = xR - r; ky = yT + r; }
          else if (px > xR - r && py > yB - r) { kx = xR - r; ky = yB - r; }
          else if (px < xL + r && py > yB - r) { kx = xL + r; ky = yB - r; }
          if (kx === null) return tVal;

          const ox = x1 - kx;
          const oy = y1 - ky;
          if (ox * ox + oy * oy <= r * r && !isStart) return tVal;
          const A = dx * dx + dy * dy;
          const B = 2 * (ox * dx + oy * dy);
          const C = ox * ox + oy * oy - r * r;
          const disc = B * B - 4 * A * C;
          if (disc <= 0 || A < 1e-12) return null;
          const sD = Math.sqrt(disc);
          const ca = (-B - sD) / (2 * A);
          const cb = (-B + sD) / (2 * A);
          return isStart ? Math.max(tVal, Math.min(ca, cb)) : Math.min(tVal, Math.max(ca, cb));
        };

        const ntMin = clipCornerCircle(tMin, true);
        const ntMax = clipCornerCircle(tMax, false);
        if (ntMin === null || ntMax === null || ntMin >= ntMax - 1e-5) return null;
        tMin = ntMin;
        tMax = ntMax;
      }

      const [cx1, cy1] = clampPointToShapeInterior(el, x1 + tMin * dx, y1 + tMin * dy, ins);
      const [cx2, cy2] = clampPointToShapeInterior(el, x1 + tMax * dx, y1 + tMax * dy, ins);
      return [cx1, cy1, cx2, cy2];
    }

    function roughEdge(path, x1, y1, x2, y2, rng, roughness = 0.85) {
      const r = Number(roughness) || 0;
      if (r <= 0.001) {
        path.moveTo(x1, y1);
        path.lineTo(x2, y2);
        return;
      }
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len;
      const ny = dx / len;
      const isCartoon = r > 1.2;
      const passes = isCartoon ? 3 : 2;
      const endJit = isCartoon ? 4.8 : 1.6 * r;
      const bowMag = isCartoon
        ? Math.min(11.0, Math.max(4.8, len * 0.055))
        : Math.min(4.8, Math.max(2.2, len * 0.025)) * r;

      for (let pass = 0; pass < passes; pass++) {
        const sign = pass === 0 ? 1 : (pass === 1 ? -0.9 : 0.55);
        const overshoot = isCartoon ? (pass === 0 ? 3.5 : -2.0) : 0;
        const ux = dx / len;
        const uy = dy / len;
        const sx = x1 - ux * overshoot + (rng() - 0.5) * endJit;
        const sy = y1 - uy * overshoot + (rng() - 0.5) * endJit;
        const ex = x2 + ux * overshoot + (rng() - 0.5) * endJit;
        const ey = y2 + uy * overshoot + (rng() - 0.5) * endJit;
        const bow1 = sign * bowMag * (0.75 + rng() * 0.5);
        const bow2 = (isCartoon && pass === 2 ? -sign : sign) * bowMag * (0.65 + rng() * 0.5);
        const cp1x = x1 + dx * 0.33 + nx * bow1;
        const cp1y = y1 + dy * 0.33 + ny * bow1;
        const cp2x = x1 + dx * 0.67 + nx * bow2;
        const cp2y = y1 + dy * 0.67 + ny * bow2;
        path.moveTo(sx, sy);
        path.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, ex, ey);
      }
    }

    function buildCleanRoundRectPath(path, x, y, w, h, r) {
      const cr = Math.max(0, Math.min(r, w / 2, h / 2));
      path.moveTo(x + cr, y);
      path.lineTo(x + w - cr, y);
      path.quadraticCurveTo(x + w, y, x + w, y + cr);
      path.lineTo(x + w, y + h - cr);
      path.quadraticCurveTo(x + w, y + h, x + w - cr, y + h);
      path.lineTo(x + cr, y + h);
      path.quadraticCurveTo(x, y + h, x, y + h - cr);
      path.lineTo(x, y + cr);
      path.quadraticCurveTo(x, y, x + cr, y);
      path.closePath();
    }

    function roughRoundRect(path, x, y, w, h, r, rng, roughness = 0.85) {
      const cr = Math.max(0, Math.min(r, w / 4, h / 4));
      if (!roughness || roughness <= 0.001) {
        buildCleanRoundRectPath(path, x, y, w, h, cr);
        return;
      }
      const isCartoon = roughness > 1.2;
      const passes = isCartoon ? 3 : 2;
      for (let p = 0; p < passes; p++) {
        const sign = p === 0 ? 1 : (p === 1 ? -0.95 : 0.6);
        const jit = isCartoon ? 4.5 : 1.6 * roughness;
        const bow = (isCartoon ? 9.5 : 3.8 * roughness) * sign;
        const j = () => (rng() - 0.5) * jit;
        const b = () => bow * (0.75 + rng() * 0.5);

        const t1x = x + cr + j(), t1y = y + j();
        const t2x = x + w - cr + j(), t2y = y + j();
        const r1x = x + w + j(), r1y = y + cr + j();
        const r2x = x + w + j(), r2y = y + h - cr + j();
        const b1x = x + w - cr + j(), b1y = y + h + j();
        const b2x = x + cr + j(), b2y = y + h + j();
        const l1x = x + j(), l1y = y + h - cr + j();
        const l2x = x + j(), l2y = y + cr + j();

        path.moveTo(t1x, t1y);
        path.quadraticCurveTo((t1x + t2x) / 2 + j(), (t1y + t2y) / 2 - b(), t2x, t2y);
        path.quadraticCurveTo(x + w + j(), y + j(), r1x, r1y);
        path.quadraticCurveTo((r1x + r2x) / 2 + b(), (r1y + r2y) / 2 + j(), r2x, r2y);
        path.quadraticCurveTo(x + w + j(), y + h + j(), b1x, b1y);
        path.quadraticCurveTo((b1x + b2x) / 2 + j(), (b1y + b2y) / 2 + b(), b2x, b2y);
        path.quadraticCurveTo(x + j(), y + h + j(), l1x, l1y);
        path.quadraticCurveTo((l1x + l2x) / 2 - b(), (l1y + l2y) / 2 + j(), l2x, l2y);
        path.quadraticCurveTo(x + j(), y + j(), t1x, t1y);
      }
    }

    function roughEllipse(path, cx, cy, rx, ry, rng, roughness = 0.85) {
      if (!roughness || roughness <= 0.001) {
        path.ellipse(cx, cy, Math.max(1, rx), Math.max(1, ry), 0, 0, Math.PI * 2);
        return;
      }
      const isCartoon = roughness > 1.2;
      const steps = 16;
      const passes = isCartoon ? 3 : 2;
      for (let pass = 0; pass < passes; pass++) {
        const sign = pass === 0 ? 1 : (pass === 1 ? -1 : 0.65);
        const waveAmp = isCartoon ? 5.8 : 2.4 * roughness;
        const jitAmp = isCartoon ? 3.6 : 1.2 * roughness;
        const phase = rng() * Math.PI * 2 + pass * 1.7;
        const cxShift = sign * (isCartoon ? 2.4 : 0.9 * roughness);
        const cyShift = -sign * (isCartoon ? 2.0 : 0.8 * roughness);
        const pts = [];
        for (let i = 0; i < steps; i++) {
          const theta = (i / steps) * Math.PI * 2;
          const radialWave = Math.sin(theta * 2 + phase) * waveAmp * sign;
          const curRx = Math.max(2, rx + radialWave);
          const curRy = Math.max(2, ry - radialWave * 0.75);
          const px = cx + cxShift + Math.cos(theta) * curRx + (rng() - 0.5) * jitAmp;
          const py = cy + cyShift + Math.sin(theta) * curRy + (rng() - 0.5) * jitAmp;
          pts.push([px, py]);
        }
        const firstMidX = (pts[steps - 1][0] + pts[0][0]) / 2;
        const firstMidY = (pts[steps - 1][1] + pts[0][1]) / 2;
        path.moveTo(firstMidX, firstMidY);
        const totalSteps = isCartoon && pass === 0 ? steps + 1 : steps;
        for (let i = 0; i < totalSteps; i++) {
          const curr = pts[i % steps];
          const next = pts[(i + 1) % steps];
          const midX = (curr[0] + next[0]) / 2;
          const midY = (curr[1] + next[1]) / 2;
          path.quadraticCurveTo(curr[0], curr[1], midX, midY);
        }
      }
    }

    const ShapeCache = {
      cache: new Map(),

      keyFor(el) {
        return [
          el.id,
          el.type,
          Math.round(el.x * 10) / 10,
          Math.round(el.y * 10) / 10,
          Math.round((el.width || 0) * 10) / 10,
          Math.round((el.height || 0) * 10) / 10,
          el.seed || 1,
          el.versionNonce || 1,
          el.roughness ?? 0.85,
          el.fillStyle || 'hachure',
          el.strokeWidth || 2.2
        ].join('|');
      },

      generate(el) {
        const rng = mulberry32((Number(el.seed) || 1) ^ (Number(el.versionNonce) || 1));
        const fillPath = new Path2D();
        const strokePath = new Path2D();
        const hachurePath = new Path2D();

        const x = Number(el.x) || 0;
        const y = Number(el.y) || 0;
        const w = Math.max(2, Number(el.width) || 0);
        const h = Math.max(2, Number(el.height) || 0);
        const cx = x + w / 2;
        const cy = y + h / 2;
        const roughness = el.roughness ?? 0.85;

        if (el.type === 'ellipse') {
          const rx = Math.max(1, w / 2);
          const ry = Math.max(1, h / 2);
          fillPath.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
          roughEllipse(strokePath, cx, cy, rx, ry, rng, roughness);
        } else if (el.type === 'diamond') {
          const top = [cx, y];
          const right = [x + w, cy];
          const bottom = [cx, y + h];
          const left = [x, cy];
          fillPath.moveTo(top[0], top[1]);
          fillPath.lineTo(right[0], right[1]);
          fillPath.lineTo(bottom[0], bottom[1]);
          fillPath.lineTo(left[0], left[1]);
          fillPath.closePath();

          roughEdge(strokePath, top[0], top[1], right[0], right[1], rng, roughness);
          roughEdge(strokePath, right[0], right[1], bottom[0], bottom[1], rng, roughness);
          roughEdge(strokePath, bottom[0], bottom[1], left[0], left[1], rng, roughness);
          roughEdge(strokePath, left[0], left[1], top[0], top[1], rng, roughness);
        } else if (el.type === 'rectangle' || el.type === 'sticky') {
          const r = el.type === 'sticky' ? 4 : Math.min(14, w / 4, h / 4);
          buildCleanRoundRectPath(fillPath, x, y, w, h, r);
          roughRoundRect(strokePath, x, y, w, h, r, rng, el.type === 'sticky' ? roughness * 0.65 : roughness);
        }

        const fillStyle = el.fillStyle || 'hachure';
        if ((fillStyle === 'hachure' || fillStyle === 'cross-hatch') &&
            (el.type === 'rectangle' || el.type === 'ellipse' || el.type === 'diamond' || el.type === 'sticky')) {
          const isCartoon = roughness > 1.2;
          const spacing = roughness <= 0.001 ? 8.0 : (isCartoon ? 11.0 : 8.5);
          const inset = Math.max(2.2, (Number(el.strokeWidth) || 2) * 0.9);
          const diag = w + h;
          const hatchBow = roughness <= 0.001 ? 0 : (isCartoon ? 12.0 : roughness * 4.5);

          const addClippedHatchSegment = (rawX1, rawY1, rawX2, rawY2) => {
            const clipped = clipSegmentToShape(el, rawX1, rawY1, rawX2, rawY2, inset);
            if (!clipped) return;
            const [cx1, cy1, cx2, cy2] = clipped;
            if (Math.hypot(cx2 - cx1, cy2 - cy1) <= 1.5) return;
            if (hatchBow <= 0.001) {
              hachurePath.moveTo(cx1, cy1);
              hachurePath.lineTo(cx2, cy2);
              return;
            }
            const sign = rng() > 0.5 ? 1 : -1;
            const rawMx = (cx1 + cx2) / 2 + sign * hatchBow * (0.6 + rng() * 0.4);
            const rawMy = (cy1 + cy2) / 2 - sign * hatchBow * (0.6 + rng() * 0.4);
            const [mx, my] = clampPointToShapeInterior(el, rawMx, rawMy, inset);
            hachurePath.moveTo(cx1, cy1);
            hachurePath.quadraticCurveTo(mx, my, cx2, cy2);
          };

          for (let d = -diag; d <= diag; d += spacing) {
            const jStep = isCartoon ? (rng() - 0.5) * 3.5 : 0;
            addClippedHatchSegment(x + d + jStep, y + h, x + d + h + jStep, y);
          }

          if (fillStyle === 'cross-hatch') {
            for (let d = -diag; d <= diag; d += spacing * 1.05) {
              const jStep = isCartoon ? (rng() - 0.5) * 3.5 : 0;
              addClippedHatchSegment(x + d + jStep, y, x + d + h + jStep, y + h);
            }
          }
        }

        return { fillPath, strokePath, hachurePath };
      },

      get(el) {
        const key = this.keyFor(el);
        let entry = this.cache.get(el.id);
        if (!entry || entry.key !== key) {
          const paths = this.generate(el);
          entry = { key, paths };
          this.cache.set(el.id, entry);
        }
        return entry.paths;
      },

      invalidate(el) {
        if (!el) return;
        const id = typeof el === 'string' ? el : el.id;
        if (typeof el === 'object' && el !== null) {
          el.versionNonce = (Number(el.versionNonce) || 1) + 1;
        }
        this.cache.delete(id);
      },

      clear() {
        this.cache.clear();
      }
    };

    /* -------------------------------------------------------------------------
     * 4. Perimeter Sliding (focusAngle) & Arrow Geometry Engine
     * ------------------------------------------------------------------------- */
    function isNodeElement(el) {
      return el && (el.type === 'rectangle' || el.type === 'ellipse' || el.type === 'diamond' || el.type === 'sticky' || el.type === 'text');
    }

    function angleToSide(angle) {
      if (typeof angle !== 'number' || Number.isNaN(angle)) return 'right';
      const deg = (angle * 180) / Math.PI;
      if (deg >= -45 && deg <= 45) return 'right';
      if (deg > 45 && deg < 135) return 'bottom';
      if (deg >= -135 && deg < -45) return 'top';
      return 'left';
    }

    function computeBindingForShape(shape, worldPt) {
      if (!shape || !worldPt) return null;
      const cx = shape.x + shape.width / 2;
      const cy = shape.y + shape.height / 2;
      const dx = worldPt.x - cx;
      const dy = worldPt.y - cy;
      const rx = Math.max(1, shape.width / 2);
      const ry = Math.max(1, shape.height / 2);
      const normDist = Math.hypot(dx / rx, dy / ry);

      let focusAngle = null;
      if (normDist >= 0.35 || (Math.abs(dx) > 0.001 || Math.abs(dy) > 0.001)) {
        focusAngle = Math.atan2(dy, dx);
      }
      const coreCenter = normDist < 0.35;
      return {
        elementId: shape.id,
        focusAngle,
        coreCenter,
        side: angleToSide(focusAngle ?? 0),
        gap: 4
      };
    }

    function getBindingBoundaryPoint(shape, binding, fallbackRefPt, gap = 4) {
      if (!shape) return fallbackRefPt || { x: 0, y: 0 };
      const cx = shape.x + shape.width / 2;
      const cy = shape.y + shape.height / 2;

      let theta = 0;
      if (binding && typeof binding.focusAngle === 'number' && !Number.isNaN(binding.focusAngle) && !binding.coreCenter) {
        theta = binding.focusAngle;
      } else if (fallbackRefPt && (Math.abs(fallbackRefPt.x - cx) > 0.01 || Math.abs(fallbackRefPt.y - cy) > 0.01)) {
        theta = Math.atan2(fallbackRefPt.y - cy, fallbackRefPt.x - cx);
      } else if (binding && typeof binding.focusAngle === 'number') {
        theta = binding.focusAngle;
      }

      const ux = Math.cos(theta);
      const uy = Math.sin(theta);
      const g = (binding && typeof binding.gap === 'number') ? binding.gap : (Number(gap) || 0);
      const hw = Math.max(1, shape.width / 2 + g);
      const hh = Math.max(1, shape.height / 2 + g);

      if (shape.type === 'ellipse') {
        const denom = Math.hypot(ux / hw, uy / hh) || 1;
        const t = 1 / denom;
        return { x: cx + t * ux, y: cy + t * uy, angle: theta };
      }

      if (shape.type === 'diamond') {
        const denom = (Math.abs(ux) / hw + Math.abs(uy) / hh) || 1;
        const t = 1 / denom;
        return { x: cx + t * ux, y: cy + t * uy, angle: theta };
      }

      const tx = Math.abs(ux) > 1e-9 ? hw / Math.abs(ux) : Infinity;
      const ty = Math.abs(uy) > 1e-9 ? hh / Math.abs(uy) : Infinity;
      const t = Math.min(tx, ty);
      return { x: cx + t * ux, y: cy + t * uy, angle: theta };
    }

    function distanceToShapeBoundary(shape, wx, wy) {
      if (!shape) return Infinity;
      const cx = shape.x + shape.width / 2;
      const cy = shape.y + shape.height / 2;
      const hw = Math.max(1, shape.width / 2);
      const hh = Math.max(1, shape.height / 2);
      const dx = wx - cx;
      const dy = wy - cy;

      if (shape.type === 'ellipse') {
        const norm = Math.hypot(dx / hw, dy / hh);
        if (norm <= 1) return 0;
        const theta = Math.atan2(dy, dx);
        const bx = cx + Math.cos(theta) * hw;
        const by = cy + Math.sin(theta) * hh;
        return Math.hypot(wx - bx, wy - by);
      }

      if (shape.type === 'diamond') {
        const l1 = Math.abs(dx) / hw + Math.abs(dy) / hh;
        if (l1 <= 1) return 0;
        const pt = getBindingBoundaryPoint(shape, { focusAngle: Math.atan2(dy, dx), gap: 0 }, null, 0);
        return Math.hypot(wx - pt.x, wy - pt.y);
      }

      const clampedX = Math.max(shape.x, Math.min(shape.x + shape.width, wx));
      const clampedY = Math.max(shape.y, Math.min(shape.y + shape.height, wy));
      return Math.hypot(wx - clampedX, wy - clampedY);
    }

    function findMagneticShape(wx, wy, excludeId = null) {
      const snapRadius = 42 / (state.zoom || 1);
      let bestShape = null;
      let bestScore = Infinity;

      for (let i = state.elements.length - 1; i >= 0; i--) {
        const el = state.elements[i];
        if (!isNodeElement(el) || el.id === excludeId) continue;
        const d = distanceToShapeBoundary(el, wx, wy);
        if (d <= snapRadius && d < bestScore) {
          bestScore = d;
          bestShape = el;
        }
      }
      return bestShape;
    }

    function getElementMap(elements = state.elements) {
      const map = new Map();
      for (const el of elements) map.set(el.id, el);
      return map;
    }

    function getArrowGeometry(el, elementsMap = null) {
      const map = elementsMap || getElementMap();
      const startShape = el.startBinding?.elementId ? map.get(el.startBinding.elementId) : null;
      const endShape = el.endBinding?.elementId ? map.get(el.endBinding.elementId) : null;

      let rawP0 = { x: Number(el.x) || 0, y: Number(el.y) || 0 };
      let rawP1 = {
        x: typeof el.x2 === 'number' ? el.x2 : (rawP0.x + (Number(el.width) || 120)),
        y: typeof el.y2 === 'number' ? el.y2 : (rawP0.y + (Number(el.height) || 0))
      };

      const startCenter = startShape
        ? { x: startShape.x + startShape.width / 2, y: startShape.y + startShape.height / 2 }
        : rawP0;
      const endCenter = endShape
        ? { x: endShape.x + endShape.width / 2, y: endShape.y + endShape.height / 2 }
        : rawP1;

      if (startShape && el.startBinding && typeof el.startBinding.focusAngle === 'number') {
        const natAng = Math.atan2(endCenter.y - startCenter.y, endCenter.x - startCenter.x);
        const diff = Math.abs(Math.atan2(Math.sin(natAng - el.startBinding.focusAngle), Math.cos(natAng - el.startBinding.focusAngle)));
        if (diff > Math.PI * 0.55) {
          el.startBinding.focusAngle = natAng;
          el.startBinding.side = angleToSide(natAng);
        }
      }
      if (endShape && el.endBinding && typeof el.endBinding.focusAngle === 'number') {
        const natAng = Math.atan2(startCenter.y - endCenter.y, startCenter.x - endCenter.x);
        const diff = Math.abs(Math.atan2(Math.sin(natAng - el.endBinding.focusAngle), Math.cos(natAng - el.endBinding.focusAngle)));
        if (diff > Math.PI * 0.55) {
          el.endBinding.focusAngle = natAng;
          el.endBinding.side = angleToSide(natAng);
        }
      }

      let p0 = startShape
        ? getBindingBoundaryPoint(startShape, el.startBinding, endShape ? endCenter : rawP1, 4)
        : rawP0;
      let p1 = endShape
        ? getBindingBoundaryPoint(endShape, el.endBinding, startShape ? startCenter : p0, 4)
        : rawP1;

      const curveType = el.curveType || 'curved';
      const curveOffset = curveType === 'straight' ? 0 : (Number(el.curveOffset) || 0);

      const N = 40;
      const samples = [];
      const cumLenArr = [0];
      let totalLen = 0;
      let waypoints = [p0, p1];
      let elbowAxis = 'x';

      if (curveType === 'elbow') {
        const dx = endCenter.x - startCenter.x;
        const dy = endCenter.y - startCenter.y;
        const shw = startShape ? startShape.width / 2 + 4 : 0;
        const shh = startShape ? startShape.height / 2 + 4 : 0;
        const ehw = endShape ? endShape.width / 2 + 4 : 0;
        const ehh = endShape ? endShape.height / 2 + 4 : 0;

        const normDx = Math.abs(dx) / Math.max(40, shw + ehw);
        const normDy = Math.abs(dy) / Math.max(40, shh + ehh);
        const verticalFirst = normDy > normDx * 1.15;

        const p0H = startShape
          ? getBindingBoundaryPoint(startShape, { focusAngle: dx >= 0 ? 0 : Math.PI, gap: 4 }, endCenter, 4)
          : rawP0;
        const p0V = startShape
          ? getBindingBoundaryPoint(startShape, { focusAngle: dy >= 0 ? Math.PI / 2 : -Math.PI / 2, gap: 4 }, endCenter, 4)
          : rawP0;
        var elbowBaseMid = { x: (p0H.x + p1.x) / 2, y: (p0V.y + p1.y) / 2 };

        let rawWaypoints;
        let handlePt;
        if (verticalFirst) {
          elbowAxis = 'y';
          p0 = p0V;
          const midY0 = (p0.y + p1.y) / 2;
          const rawElbowY = midY0 + curveOffset * 0.5;
          const goesIntoStart = startShape && (dy >= 0 ? rawElbowY < p0.y + 8 : rawElbowY > p0.y - 8);

          if (goesIntoStart && Math.abs(p1.x - p0H.x) > 12) {
            p0 = p0H;
            rawWaypoints = [
              { x: p0.x, y: p0.y },
              { x: p1.x, y: p0.y },
              { x: p1.x, y: p1.y }
            ];
            handlePt = { x: (p0.x + p1.x) / 2, y: p0.y };
          } else if (Math.abs(rawElbowY - p1.y) < 16 && Math.abs(p1.x - p0.x) > 14) {
            rawWaypoints = [
              { x: p0.x, y: p0.y },
              { x: p0.x, y: p1.y },
              { x: p1.x, y: p1.y }
            ];
            handlePt = { x: p0.x, y: p1.y };
          } else {
            let elbowY = rawElbowY;
            if (startShape) {
              elbowY = dy >= 0 ? Math.max(p0.y + 12, elbowY) : Math.min(p0.y - 12, elbowY);
            }
            rawWaypoints = [
              { x: p0.x, y: p0.y },
              { x: p0.x, y: elbowY },
              { x: p1.x, y: elbowY },
              { x: p1.x, y: p1.y }
            ];
            handlePt = { x: (p0.x + p1.x) / 2, y: elbowY };
          }
        } else {
          elbowAxis = 'x';
          p0 = p0H;
          const midX0 = (p0.x + p1.x) / 2;
          const rawElbowX = midX0 + curveOffset * 0.5;
          const goesIntoStart = startShape && (dx >= 0 ? rawElbowX < p0.x + 8 : rawElbowX > p0.x - 8);

          if (goesIntoStart && Math.abs(p1.y - p0V.y) > 12) {
            p0 = p0V;
            rawWaypoints = [
              { x: p0.x, y: p0.y },
              { x: p0.x, y: p1.y },
              { x: p1.x, y: p1.y }
            ];
            handlePt = { x: p0.x, y: (p0.y + p1.y) / 2 };
          } else if (Math.abs(rawElbowX - p1.x) < 16 && Math.abs(p1.y - p0.y) > 14) {
            rawWaypoints = [
              { x: p0.x, y: p0.y },
              { x: p1.x, y: p0.y },
              { x: p1.x, y: p1.y }
            ];
            handlePt = { x: p1.x, y: (p0.y + p1.y) / 2 };
          } else {
            let elbowX = rawElbowX;
            if (startShape) {
              elbowX = dx >= 0 ? Math.max(p0.x + 12, elbowX) : Math.min(p0.x - 12, elbowX);
            }
            rawWaypoints = [
              { x: p0.x, y: p0.y },
              { x: elbowX, y: p0.y },
              { x: elbowX, y: p1.y },
              { x: p1.x, y: p1.y }
            ];
            handlePt = { x: elbowX, y: (p0.y + p1.y) / 2 };
          }
        }

        el.x = p0.x;
        el.y = p0.y;
        el.x2 = p1.x;
        el.y2 = p1.y;
        el.width = p1.x - p0.x;
        el.height = p1.y - p0.y;

        waypoints = [rawWaypoints[0]];
        for (let i = 1; i < rawWaypoints.length; i++) {
          const prev = waypoints[waypoints.length - 1];
          const curr = rawWaypoints[i];
          if (Math.hypot(curr.x - prev.x, curr.y - prev.y) > 0.5) {
            waypoints.push(curr);
          }
        }
        if (waypoints.length < 2) {
          waypoints = [{ x: p0.x, y: p0.y }, { x: p1.x, y: p1.y }];
        } else {
          waypoints[waypoints.length - 1] = { x: p1.x, y: p1.y };
        }
        var elbowHandleOverride = handlePt;
      }

      el.x = p0.x;
      el.y = p0.y;
      el.x2 = p1.x;
      el.y2 = p1.y;
      el.width = p1.x - p0.x;
      el.height = p1.y - p0.y;

      const chordDx = p1.x - p0.x;
      const chordDy = p1.y - p0.y;
      const chordLen = Math.hypot(chordDx, chordDy) || 1;
      const nx = -chordDy / chordLen;
      const ny = chordDx / chordLen;
      const midX = (p0.x + p1.x) / 2;
      const midY = (p0.y + p1.y) / 2;
      let tipAngle = Math.atan2(chordDy, chordDx);

      const cp = {
        x: midX + nx * curveOffset,
        y: midY + ny * curveOffset
      };
      const curveHandlePt = curveType === 'elbow' && elbowHandleOverride
        ? elbowHandleOverride
        : {
            x: midX + nx * (curveOffset * 0.5),
            y: midY + ny * (curveOffset * 0.5)
          };

      if (curveType === 'elbow') {

        const segs = [];
        let polyLen = 0;
        for (let i = 0; i < waypoints.length - 1; i++) {
          const a = waypoints[i];
          const b = waypoints[i + 1];
          const sl = Math.hypot(b.x - a.x, b.y - a.y);
          if (sl > 1e-6) {
            segs.push({ a, b, sl, tx: (b.x - a.x) / sl, ty: (b.y - a.y) / sl });
            polyLen += sl;
          }
        }

        if (segs.length === 0) {
          const tx = chordDx / chordLen;
          const ty = chordDy / chordLen;
          samples.push({ x: p0.x, y: p0.y, tx, ty });
          samples.push({ x: p1.x, y: p1.y, tx, ty });
          cumLenArr.push(chordLen);
          totalLen = chordLen;
          tipAngle = Math.atan2(ty, tx);
        } else {
          for (let s = 0; s < segs.length; s++) {
            const seg = segs[s];
            const steps = Math.max(2, Math.round((seg.sl / Math.max(1, polyLen)) * N));
            const startStep = s === 0 ? 0 : 1;
            for (let k = startStep; k <= steps; k++) {
              const localT = k / steps;
              const pt = {
                x: seg.a.x + (seg.b.x - seg.a.x) * localT,
                y: seg.a.y + (seg.b.y - seg.a.y) * localT,
                tx: seg.tx,
                ty: seg.ty
              };
              if (samples.length > 0) {
                const prev = samples[samples.length - 1];
                totalLen += Math.hypot(pt.x - prev.x, pt.y - prev.y);
                cumLenArr.push(totalLen);
              }
              samples.push(pt);
            }
          }
          const lastSeg = segs[segs.length - 1];
          tipAngle = Math.atan2(lastSeg.ty, lastSeg.tx);
        }
      } else {
        for (let i = 0; i <= N; i++) {
          const t = i / N;
          const mt = 1 - t;
          const x = mt * mt * p0.x + 2 * mt * t * cp.x + t * t * p1.x;
          const y = mt * mt * p0.y + 2 * mt * t * cp.y + t * t * p1.y;
          const dxdt = 2 * mt * (cp.x - p0.x) + 2 * t * (p1.x - cp.x);
          const dydt = 2 * mt * (cp.y - p0.y) + 2 * t * (p1.y - cp.y);
          const dLen = Math.hypot(dxdt, dydt) || 1;
          const pt = { x, y, tx: dxdt / dLen, ty: dydt / dLen };
          if (i > 0) {
            totalLen += Math.hypot(x - samples[i - 1].x, y - samples[i - 1].y);
            cumLenArr.push(totalLen);
          }
          samples.push(pt);
        }
        const endSample = samples[samples.length - 1];
        tipAngle = Math.atan2(endSample.ty, endSample.tx);
      }

      const cumLen = Float64Array.from(cumLenArr);
      const midDist = totalLen * 0.5;
      const labelPt = pointAtArcLength({ samples, cumLen, totalLen }, midDist);

      // Arrows are always unbroken and clean — no text or gaps cut in between them
      return {
        p0,
        p1,
        cp,
        curveHandlePt,
        waypoints,
        elbowAxis,
        elbowBaseMid: elbowBaseMid || { x: midX, y: midY },
        tipAngle,
        samples,
        cumLen,
        totalLen: Math.max(1, totalLen),
        labelPt,
        labelBox: null,
        gapStartDist: -1,
        gapEndDist: -1
      };
    }

    function pointAtArcLength(geom, dist) {
      const samples = geom.samples;
      const cumLen = geom.cumLen;
      const N = samples.length - 1;
      if (N <= 0) return { x: 0, y: 0, tx: 1, ty: 0 };
      const clamped = Math.max(0, Math.min(geom.totalLen, dist));
      let lo = 0;
      let hi = N;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (cumLen[mid] < clamped) lo = mid + 1;
        else hi = mid;
      }
      const idx = Math.max(1, lo);
      const d0 = cumLen[idx - 1];
      const d1 = cumLen[idx];
      const seg = d1 - d0;
      const f = seg > 1e-6 ? (clamped - d0) / seg : 0;
      const a = samples[idx - 1];
      const b = samples[idx];
      return {
        x: a.x + (b.x - a.x) * f,
        y: a.y + (b.y - a.y) * f,
        tx: a.tx + (b.tx - a.tx) * f,
        ty: a.ty + (b.ty - a.ty) * f
      };
    }

    /* -------------------------------------------------------------------------
     * 5. Causal Topological Wave Timing (BFS computeGraphDepths) & Node Pulses
     * ------------------------------------------------------------------------- */
    function computeGraphDepths(elements = state.elements) {
      const nodeDepths = new Map();
      const arrowDepths = new Map();
      const adj = new Map();
      const inDeg = new Map();

      const nodes = elements.filter(isNodeElement);
      const arrows = elements.filter(e => e.type === 'arrow');

      for (const n of nodes) {
        adj.set(n.id, []);
        inDeg.set(n.id, 0);
      }

      for (const arr of arrows) {
        const u = arr.startBinding?.elementId;
        const v = arr.endBinding?.elementId;
        if (u && v && adj.has(u) && adj.has(v)) {
          adj.get(u).push({ target: v, arrowId: arr.id });
          inDeg.set(v, (inDeg.get(v) || 0) + 1);
        }
      }

      const queue = [];
      for (const n of nodes) {
        if ((inDeg.get(n.id) || 0) === 0) {
          nodeDepths.set(n.id, 0);
          queue.push(n.id);
        }
      }

      if (queue.length === 0 && nodes.length > 0) {
        nodeDepths.set(nodes[0].id, 0);
        queue.push(nodes[0].id);
      }

      let head = 0;
      while (head < queue.length) {
        const u = queue[head++];
        const d = nodeDepths.get(u) || 0;
        const edges = adj.get(u) || [];
        for (const edge of edges) {
          arrowDepths.set(edge.arrowId, d);
          if (!nodeDepths.has(edge.target)) {
            nodeDepths.set(edge.target, d + 1);
            queue.push(edge.target);
          }
        }
      }

      for (const n of nodes) {
        if (!nodeDepths.has(n.id)) nodeDepths.set(n.id, 0);
      }
      for (const arr of arrows) {
        if (!arrowDepths.has(arr.id)) {
          const u = arr.startBinding?.elementId;
          arrowDepths.set(arr.id, u && nodeDepths.has(u) ? nodeDepths.get(u) : 0);
        }
      }

      return { nodeDepths, arrowDepths };
    }

    function triggerNodePulse(nodeId) {
      const targetIds = nodeId ? [nodeId] : Array.from(state.selectedIds);
      let spawned = 0;
      const now = performance.now() / 1000;

      for (const id of targetIds) {
        const outgoing = state.elements.filter(
          el => el.type === 'arrow' && el.startBinding?.elementId === id
        );
        const targetArrows = outgoing.length > 0
          ? outgoing
          : state.elements.filter(el => el.type === 'arrow' && el.id === id);

        for (const arr of targetArrows) {
          for (let b = 0; b < 3; b++) {
            state.activePulses.push({
              id: nextId('pulse'),
              arrowId: arr.id,
              progress: -b * 0.14,
              speed: 1.35,
              color: arr.strokeColor || '#0070f3',
              createdAt: now
            });
            spawned++;
          }
        }
      }
      return spawned;
    }

    /* -------------------------------------------------------------------------
     * 6. Multi-Pass Occlusion-Free Rendering Engine
     * ------------------------------------------------------------------------- */
    // Exact Excalidraw dash array formulas from packages/element/src/shape.ts
    function applyDashStyle(ctx, strokeStyle, strokeWidth) {
      const sw = Number(strokeWidth) || 2;
      if (strokeStyle === 'dashed') {
        ctx.setLineDash([8, 8 + sw]);
      } else if (strokeStyle === 'dotted') {
        ctx.setLineDash([1.5, 6 + sw]);
      } else {
        ctx.setLineDash([]);
      }
    }

    function drawStaticElement(ctx, el, opts = {}) {
      if (!el || el.type === 'arrow') return;
      const canvasBg = opts.canvasBg || state.canvasBg;
      const strokeColor = resolveStrokeColor(el.strokeColor, canvasBg);
      const fillTint = resolveFillTint(el.strokeColor, canvasBg, el.type === 'sticky');
      const sw = Number(el.strokeWidth) || 2.2;

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const auraEnergy = state.nodeArrivalEnergy.get(el.id) || 0;
      if (auraEnergy > 0.02 && isNodeElement(el) && el.type !== 'text') {
        ctx.save();
        ctx.shadowColor = strokeColor;
        ctx.shadowBlur = 16 * auraEnergy;
        ctx.strokeStyle = strokeColor;
        ctx.globalAlpha = Math.min(0.45, auraEnergy * 0.45);
        ctx.lineWidth = sw + 2;
        const paths = ShapeCache.get(el);
        ctx.stroke(paths.fillPath);
        ctx.restore();
      }

      if (el.type === 'freedraw') {
        const pts = el.points || [];
        if (pts.length > 0) {
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = sw;
          applyDashStyle(ctx, el.strokeStyle, sw);
          ctx.beginPath();
          ctx.moveTo(el.x + pts[0][0], el.y + pts[0][1]);
          for (let i = 1; i < pts.length; i++) {
            const pPrev = pts[i - 1];
            const pCurr = pts[i];
            const mx = el.x + (pPrev[0] + pCurr[0]) / 2;
            const my = el.y + (pPrev[1] + pCurr[1]) / 2;
            ctx.quadraticCurveTo(el.x + pPrev[0], el.y + pPrev[1], mx, my);
          }
          const last = pts[pts.length - 1];
          ctx.lineTo(el.x + last[0], el.y + last[1]);
          ctx.stroke();
        }
        ctx.restore();
        return;
      }

      if (el.type === 'text') {
        ctx.restore();
        return;
      }

      const paths = ShapeCache.get(el);
      const fillStyle = el.fillStyle || 'hachure';

      if (fillStyle !== 'none') {
        ctx.save();
        ctx.fillStyle = fillTint;
        if (el.type === 'sticky') {
          ctx.shadowColor = 'rgba(0, 0, 0, 0.14)';
          ctx.shadowBlur = 12;
          ctx.shadowOffsetY = 4;
        }
        ctx.fill(paths.fillPath);
        ctx.restore();
      }

      if (fillStyle === 'hachure' || fillStyle === 'cross-hatch') {
        ctx.save();
        ctx.clip(paths.fillPath);
        ctx.strokeStyle = strokeColor;
        ctx.globalAlpha = canvasBg === '#000000' ? 0.44 : 0.36;
        // Excalidraw shape.ts: fillWeight = element.strokeWidth / 2
        ctx.lineWidth = Math.max(1.0, sw * 0.5);
        ctx.setLineDash([]);
        ctx.stroke(paths.hachurePath);
        ctx.restore();
      }

      ctx.strokeStyle = strokeColor;
      // Excalidraw shape.ts: for non-solid strokes, increase width by +0.5
      ctx.lineWidth = (el.strokeStyle && el.strokeStyle !== 'solid') ? sw + 0.5 : sw;
      applyDashStyle(ctx, el.strokeStyle, sw);
      ctx.stroke(paths.strokePath);

      ctx.restore();
    }

    function drawArrowAndParticles(ctx, el, geom, depth, timeSec, opts = {}) {
      const canvasBg = opts.canvasBg || state.canvasBg;
      const isSplitTarget = state.splitTargetArrowId === el.id;
      const strokeColor = isSplitTarget ? '#10b981' : resolveStrokeColor(el.strokeColor, canvasBg);
      const baseSw = Number(el.strokeWidth) || 2.2;
      const sw = isSplitTarget ? Math.max(3.2, baseSw + 1.2) : baseSw;

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = (el.strokeStyle && el.strokeStyle !== 'solid') ? sw + 0.5 : sw;
      applyDashStyle(ctx, el.strokeStyle, sw);

      if (isSplitTarget) {
        ctx.shadowColor = '#10b981';
        ctx.shadowBlur = 12;
      }

      const curveType = el.curveType || 'curved';
      const roughness = Number(el.roughness ?? 0.85);
      const isCartoon = roughness > 1.2;
      const samples = geom.samples;

      const strokeShaftPass = (offsetX, offsetY, cpBowOffset) => {
        ctx.beginPath();
        if (curveType === 'elbow' && geom.waypoints && geom.waypoints.length >= 2) {
          const pts = geom.waypoints;
          ctx.moveTo(pts[0].x + offsetX * 0.3, pts[0].y + offsetY * 0.3);
          for (let i = 1; i < pts.length - 1; i++) {
            const prev = pts[i - 1];
            const curr = pts[i];
            const next = pts[i + 1];
            const d1 = Math.hypot(curr.x - prev.x, curr.y - prev.y);
            const d2 = Math.hypot(next.x - curr.x, next.y - curr.y);
            const cornerR = Math.min(8, d1 * 0.35, d2 * 0.35);
            const cx = curr.x + offsetX;
            const cy = curr.y + offsetY;
            if (cornerR > 1.5 && typeof ctx.arcTo === 'function') {
              ctx.arcTo(cx, cy, next.x + offsetX, next.y + offsetY, cornerR);
            } else {
              ctx.lineTo(cx, cy);
            }
          }
          const lastPt = pts[pts.length - 1];
          ctx.lineTo(lastPt.x, lastPt.y);
        } else if (curveType === 'straight' || Math.abs(Number(el.curveOffset) || 0) < 0.5) {
          if (Math.abs(cpBowOffset) < 0.05) {
            ctx.moveTo(geom.p0.x, geom.p0.y);
            ctx.lineTo(geom.p1.x, geom.p1.y);
          } else {
            const dx = geom.p1.x - geom.p0.x;
            const dy = geom.p1.y - geom.p0.y;
            const len = Math.hypot(dx, dy) || 1;
            const nx = -dy / len;
            const ny = dx / len;
            const midX = (geom.p0.x + geom.p1.x) / 2 + nx * cpBowOffset;
            const midY = (geom.p0.y + geom.p1.y) / 2 + ny * cpBowOffset;
            ctx.moveTo(geom.p0.x + offsetX * 0.3, geom.p0.y + offsetY * 0.3);
            ctx.quadraticCurveTo(midX, midY, geom.p1.x, geom.p1.y);
          }
        } else {
          const dx = geom.p1.x - geom.p0.x;
          const dy = geom.p1.y - geom.p0.y;
          const len = Math.hypot(dx, dy) || 1;
          const nx = -dy / len;
          const ny = dx / len;
          ctx.moveTo(geom.p0.x + offsetX * 0.3, geom.p0.y + offsetY * 0.3);
          ctx.quadraticCurveTo(
            geom.cp.x + nx * cpBowOffset + offsetX,
            geom.cp.y + ny * cpBowOffset + offsetY,
            geom.p1.x,
            geom.p1.y
          );
        }
        ctx.stroke();
      };

      strokeShaftPass(0, 0, 0);

      if (roughness > 0.01 && (!el.strokeStyle || el.strokeStyle === 'solid')) {
        const rng = mulberry32((Number(el.seed) || 1) + 77);
        const extraPasses = isCartoon ? 2 : 1;
        ctx.save();
        ctx.lineWidth = Math.max(1.2, sw * (isCartoon ? 0.9 : 0.8));
        ctx.globalAlpha = isCartoon ? 0.88 : 0.72;
        for (let p = 0; p < extraPasses; p++) {
          const sign = p === 0 ? 1 : -1;
          const off = (isCartoon ? 3.2 : 1.4) * sign;
          const bow = (isCartoon ? 6.5 : 2.6) * sign * (0.7 + rng() * 0.5);
          strokeShaftPass(off * (rng() - 0.2), -off * (rng() - 0.2), bow);
        }
        ctx.restore();
      }

      // Excalidraw solid arrowhead cap (~25 degree spread)
      ctx.setLineDash([]);
      const endSample = samples[samples.length - 1] || { tx: 1, ty: 0 };
      const tipAngle = typeof geom.tipAngle === 'number'
        ? geom.tipAngle
        : Math.atan2(endSample.ty, endSample.tx);
      const headLen = Math.max(11, sw * 4.6);
      const spread = 0.44;
      ctx.beginPath();
      ctx.moveTo(
        geom.p1.x - headLen * Math.cos(tipAngle - spread),
        geom.p1.y - headLen * Math.sin(tipAngle - spread)
      );
      ctx.lineTo(geom.p1.x, geom.p1.y);
      ctx.lineTo(
        geom.p1.x - headLen * Math.cos(tipAngle + spread),
        geom.p1.y - headLen * Math.sin(tipAngle + spread)
      );
      ctx.stroke();

      if (isCartoon) {
        ctx.save();
        ctx.lineWidth = Math.max(1.2, sw * 0.85);
        ctx.globalAlpha = 0.82;
        ctx.beginPath();
        ctx.moveTo(
          geom.p1.x - (headLen + 2.5) * Math.cos(tipAngle - spread - 0.08),
          geom.p1.y - (headLen + 2.5) * Math.sin(tipAngle - spread - 0.08)
        );
        ctx.lineTo(geom.p1.x + 1.5, geom.p1.y - 1.5);
        ctx.lineTo(
          geom.p1.x - (headLen + 2.5) * Math.cos(tipAngle + spread + 0.08),
          geom.p1.y - (headLen + 2.5) * Math.sin(tipAngle + spread + 0.08)
        );
        ctx.stroke();
        ctx.restore();
      }

      const arrowFlowActive = state.flowEnabled && (el.flowEnabled !== false);
      if (arrowFlowActive && geom.totalLen > 24) {
        const packetCount = Math.max(1, Math.min(4, Math.round(geom.totalLen / 150)));
        const speed = (Number(state.flowSpeed) || 1.0) * 0.55;
        const hopOffset = -(Number(depth) || 0) * 0.38;
        const mode = state.flowMode || 'comets';

        for (let k = 0; k < packetCount; k++) {
          let phase = (timeSec * speed + hopOffset + k / packetCount) % 1;
          if (phase < 0) phase += 1;

          if (phase > 0.82 && el.endBinding?.elementId) {
            const boost = (phase - 0.82) / 0.18;
            const prev = state.nodeArrivalEnergy.get(el.endBinding.elementId) || 0;
            state.nodeArrivalEnergy.set(el.endBinding.elementId, Math.max(prev, Math.sin(boost * Math.PI)));
          }

          const dist = phase * geom.totalLen;
          drawFlowParticleAt(ctx, geom, dist, phase, strokeColor, sw, mode, canvasBg);
        }
      }

      for (let i = state.activePulses.length - 1; i >= 0; i--) {
        const pulse = state.activePulses[i];
        if (pulse.arrowId !== el.id) continue;
        if (pulse.progress >= 0 && pulse.progress <= 1) {
          const dist = pulse.progress * geom.totalLen;
          drawFlowParticleAt(ctx, geom, dist, pulse.progress, strokeColor, sw * 1.45, 'neon', canvasBg, true);
          if (pulse.progress > 0.8 && el.endBinding?.elementId) {
            state.nodeArrivalEnergy.set(el.endBinding.elementId, 1.0);
          }
        }
      }

      ctx.restore();
    }

    function drawFlowParticleAt(ctx, geom, dist, phase, color, sw, mode, canvasBg, isBurst = false) {
      const pt = pointAtArcLength(geom, dist);
      const isDark = canvasBg === '#000000';
      const coreColor = isDark || isBurst ? '#ffffff' : color;

      ctx.save();
      if (mode === 'comets') {
        const tailLen = Math.min(34, geom.totalLen * 0.22);
        const segs = 7;
        for (let s = 0; s < segs; s++) {
          const d0 = Math.max(0, dist - (s / segs) * tailLen);
          const d1 = Math.max(0, dist - ((s + 1) / segs) * tailLen);
          if (d0 <= d1) continue;
          const pA = pointAtArcLength(geom, d0);
          const pB = pointAtArcLength(geom, d1);
          const frac = 1 - s / segs;
          ctx.beginPath();
          ctx.strokeStyle = color;
          ctx.globalAlpha = frac * (isDark ? 0.92 : 0.82);
          ctx.lineWidth = Math.max(1.2, sw * 2.1 * frac);
          ctx.moveTo(pA.x, pA.y);
          ctx.lineTo(pB.x, pB.y);
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.shadowColor = color;
        ctx.shadowBlur = isDark ? 14 : 8;
        ctx.fillStyle = coreColor;
        ctx.arc(pt.x, pt.y, Math.max(2.8, sw * 1.35), 0, Math.PI * 2);
        ctx.fill();
      } else if (mode === 'pulses') {
        const ringExpand = (phase * 4) % 1;
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.globalAlpha = (1 - ringExpand) * 0.75;
        ctx.lineWidth = 1.8;
        ctx.arc(pt.x, pt.y, 3 + ringExpand * 11, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.fillStyle = color;
        ctx.arc(pt.x, pt.y, Math.max(3, sw * 1.3), 0, Math.PI * 2);
        ctx.fill();
      } else if (mode === 'neon') {
        const tailLen = Math.min(28, geom.totalLen * 0.18);
        const pTail = pointAtArcLength(geom, Math.max(0, dist - tailLen));
        ctx.beginPath();
        ctx.shadowColor = color;
        ctx.shadowBlur = isDark ? 18 : 12;
        ctx.strokeStyle = color;
        ctx.lineWidth = sw * 2.6;
        ctx.globalAlpha = 0.85;
        ctx.moveTo(pTail.x, pTail.y);
        ctx.lineTo(pt.x, pt.y);
        ctx.stroke();

        ctx.beginPath();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = Math.max(1.4, sw * 0.95);
        ctx.globalAlpha = 0.95;
        ctx.moveTo(pTail.x, pTail.y);
        ctx.lineTo(pt.x, pt.y);
        ctx.stroke();
      } else if (mode === 'dashed') {
        const segLen = 10;
        const pBack = pointAtArcLength(geom, Math.max(0, dist - segLen));
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = sw * 1.9;
        ctx.moveTo(pBack.x, pBack.y);
        ctx.lineTo(pt.x, pt.y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawElementText(ctx, el, opts = {}) {
      // Never render text on arrows
      if (!el || el.type === 'arrow' || !el.text || String(el.text).trim().length === 0) return;
      if (state.editingId === el.id && !opts.forExport) return;

      const canvasBg = opts.canvasBg || state.canvasBg;
      const strokeColor = resolveStrokeColor(el.strokeColor, canvasBg);
      const fontSize = Number(el.fontSize) || 16;
      const lineHeight = Math.round(fontSize * EXCALIDRAW_LINE_HEIGHT);
      const lines = String(el.text).split('\n');

      ctx.save();
      ctx.font = getFontCss(el.fontFamily, fontSize);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const centerX = el.x + (el.width || 0) / 2;
      const centerY = el.y + (el.height || 0) / 2;
      const totalTextH = lines.length * lineHeight;
      const startY = centerY - totalTextH / 2 + lineHeight / 2;

      ctx.fillStyle = strokeColor;
      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], centerX, startY + i * lineHeight);
      }

      ctx.restore();
    }

    function renderScenePasses(ctx, timeSec = 0, opts = {}) {
      const elements = opts.elements || state.elements;
      const elementsMap = getElementMap(elements);
      const { arrowDepths } = computeGraphDepths(elements);

      for (const [nodeId, val] of state.nodeArrivalEnergy.entries()) {
        const nextVal = val * 0.91;
        if (nextVal < 0.01) state.nodeArrivalEnergy.delete(nodeId);
        else state.nodeArrivalEnergy.set(nodeId, nextVal);
      }

      const arrowGeoms = new Map();
      for (const el of elements) {
        if (el.type === 'arrow') {
          arrowGeoms.set(el.id, getArrowGeometry(el, elementsMap));
        }
      }

      for (const el of elements) {
        if (el.type !== 'arrow') {
          drawStaticElement(ctx, el, opts);
        }
      }

      for (const el of elements) {
        if (el.type === 'arrow') {
          const geom = arrowGeoms.get(el.id);
          const depth = arrowDepths.get(el.id) || 0;
          drawArrowAndParticles(ctx, el, geom, depth, timeSec, opts);
        }
      }

      for (const el of elements) {
        if (el.type !== 'arrow') {
          drawElementText(ctx, el, opts);
        }
      }

      return arrowGeoms;
    }

    /* -------------------------------------------------------------------------
     * 7. Hit Testing, 8-Way Resize Handles, Ports & Inline Node Splitting
     * ------------------------------------------------------------------------- */
    function getResizeHandles(el) {
      if (!isNodeElement(el) || el.type === 'text') return [];
      const pad = 6 / (state.zoom || 1);
      const x = el.x - pad;
      const y = el.y - pad;
      const w = (el.width || 0) + pad * 2;
      const h = (el.height || 0) + pad * 2;
      return [
        { dir: 'nw', x: x,         y: y,         cursor: 'nwse-resize' },
        { dir: 'n',  x: x + w / 2, y: y,         cursor: 'ns-resize' },
        { dir: 'ne', x: x + w,     y: y,         cursor: 'nesw-resize' },
        { dir: 'e',  x: x + w,     y: y + h / 2, cursor: 'ew-resize' },
        { dir: 'se', x: x + w,     y: y + h,     cursor: 'nwse-resize' },
        { dir: 's',  x: x + w / 2, y: y + h,     cursor: 'ns-resize' },
        { dir: 'sw', x: x,         y: y + h,     cursor: 'nesw-resize' },
        { dir: 'w',  x: x,         y: y + h / 2, cursor: 'ew-resize' }
      ];
    }

    function hitTestResizeHandles(wx, wy) {
      if (state.selectedIds.size !== 1) return null;
      const id = Array.from(state.selectedIds)[0];
      const el = state.elements.find(e => e.id === id);
      if (!el || !isNodeElement(el) || el.type === 'text') return null;

      const tol = 8 / (state.zoom || 1);
      for (const h of getResizeHandles(el)) {
        if (Math.hypot(wx - h.x, wy - h.y) <= tol) {
          return { elementId: el.id, dir: h.dir, cursor: h.cursor };
        }
      }
      return null;
    }

    function getQuickConnectPorts(el) {
      if (!isNodeElement(el) || el.type === 'text') return [];
      const gap = 18 / (state.zoom || 1);
      const cx = el.x + el.width / 2;
      const cy = el.y + el.height / 2;
      return [
        { dir: 'top',    x: cx,                    y: el.y - gap,              angle: -Math.PI / 2 },
        { dir: 'right',  x: el.x + el.width + gap, y: cy,                      angle: 0 },
        { dir: 'bottom', x: cx,                    y: el.y + el.height + gap,  angle: Math.PI / 2 },
        { dir: 'left',   x: el.x - gap,            y: cy,                      angle: Math.PI }
      ];
    }

    function hitTestQuickPorts(wx, wy) {
      const candidateIds = new Set(state.selectedIds);
      if (state.hoveredId) candidateIds.add(state.hoveredId);
      const hitRadius = 12 / (state.zoom || 1);

      for (const id of candidateIds) {
        const el = state.elements.find(e => e.id === id);
        if (!el || !isNodeElement(el) || el.type === 'text') continue;
        const ports = getQuickConnectPorts(el);
        for (const p of ports) {
          if (Math.hypot(wx - p.x, wy - p.y) <= hitRadius) {
            return { elementId: el.id, dir: p.dir, x: p.x, y: p.y };
          }
        }
      }
      return null;
    }

    function hitTestArrowHandle(wx, wy) {
      const radius = 18 / (state.zoom || 1);
      const elementsMap = getElementMap();

      const arrows = state.elements.filter(e => e.type === 'arrow');
      arrows.sort((a, b) => {
        const aPri = (state.selectedIds.has(a.id) || state.hoveredId === a.id) ? 1 : 0;
        const bPri = (state.selectedIds.has(b.id) || state.hoveredId === b.id) ? 1 : 0;
        return bPri - aPri;
      });

      for (const arr of arrows) {
        const geom = getArrowGeometry(arr, elementsMap);
        if (Math.hypot(wx - geom.p0.x, wy - geom.p0.y) <= radius) {
          return { elementId: arr.id, handle: 'start', point: geom.p0 };
        }
        if (Math.hypot(wx - geom.p1.x, wy - geom.p1.y) <= radius) {
          return { elementId: arr.id, handle: 'end', point: geom.p1 };
        }
        if ((arr.curveType || 'curved') !== 'straight' && Math.hypot(wx - geom.curveHandlePt.x, wy - geom.curveHandlePt.y) <= radius) {
          return { elementId: arr.id, handle: 'curve', point: geom.curveHandlePt };
        }
      }
      return null;
    }

    function distanceToArrowShaft(arrow, wx, wy, elementsMap = null) {
      const geom = getArrowGeometry(arrow, elementsMap);
      let minDist = Infinity;
      const samples = geom.samples;
      for (let i = 0; i < samples.length - 1; i++) {
        const a = samples[i];
        const b = samples[i + 1];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const len2 = dx * dx + dy * dy;
        const t = len2 > 1e-6 ? Math.max(0, Math.min(1, ((wx - a.x) * dx + (wy - a.y) * dy) / len2)) : 0;
        const px = a.x + t * dx;
        const py = a.y + t * dy;
        const d = Math.hypot(wx - px, wy - py);
        if (d < minDist) minDist = d;
      }
      return minDist;
    }

    function hitTestElement(wx, wy) {
      const elementsMap = getElementMap();
      const arrowTol = 11 / (state.zoom || 1);

      for (let i = state.elements.length - 1; i >= 0; i--) {
        const el = state.elements[i];
        if (el.type === 'arrow') {
          if (distanceToArrowShaft(el, wx, wy, elementsMap) <= arrowTol) {
            return el;
          }
          continue;
        }
        if (el.type === 'freedraw') {
          const pts = el.points || [];
          for (const p of pts) {
            if (Math.hypot(wx - (el.x + p[0]), wy - (el.y + p[1])) <= 10 / (state.zoom || 1)) {
              return el;
            }
          }
          continue;
        }
        if (el.type === 'ellipse') {
          const cx = el.x + el.width / 2;
          const cy = el.y + el.height / 2;
          const rx = Math.max(4, el.width / 2 + 4);
          const ry = Math.max(4, el.height / 2 + 4);
          if (((wx - cx) / rx) ** 2 + ((wy - cy) / ry) ** 2 <= 1) return el;
          continue;
        }
        if (el.type === 'diamond') {
          const cx = el.x + el.width / 2;
          const cy = el.y + el.height / 2;
          const hw = Math.max(4, el.width / 2 + 4);
          const hh = Math.max(4, el.height / 2 + 4);
          if (Math.abs(wx - cx) / hw + Math.abs(wy - cy) / hh <= 1) return el;
          continue;
        }
        if (wx >= el.x && wx <= el.x + el.width && wy >= el.y && wy <= el.y + el.height) {
          return el;
        }
      }
      return null;
    }

    function findSplitTargetArrow(node) {
      if (!node || !isNodeElement(node) || node.type === 'text') return null;
      const cx = node.x + node.width / 2;
      const cy = node.y + node.height / 2;
      const elementsMap = getElementMap();
      const threshold = Math.min(node.width, node.height) * 0.45;

      for (const el of state.elements) {
        if (el.type !== 'arrow') continue;
        if (el.startBinding?.elementId === node.id || el.endBinding?.elementId === node.id) continue;
        const d = distanceToArrowShaft(el, cx, cy, elementsMap);
        if (d <= threshold) return el;
      }
      return null;
    }

    function trySplitArrowWithNode(node) {
      const arrow = findSplitTargetArrow(node);
      if (!arrow) return false;

      const origEndBinding = arrow.endBinding ? { ...arrow.endBinding } : null;
      const origX2 = arrow.x2;
      const origY2 = arrow.y2;

      const nodeCenter = { x: node.x + node.width / 2, y: node.y + node.height / 2 };
      const geom = getArrowGeometry(arrow);

      arrow.endBinding = computeBindingForShape(node, geom.p0);
      arrow.curveOffset = 0;

      const newArrow = createElement('arrow', {
        x: nodeCenter.x,
        y: nodeCenter.y,
        x2: origX2,
        y2: origY2,
        strokeColor: arrow.strokeColor,
        strokeWidth: arrow.strokeWidth,
        strokeStyle: arrow.strokeStyle,
        curveType: arrow.curveType,
        curveOffset: 0,
        startBinding: computeBindingForShape(node, geom.p1),
        endBinding: origEndBinding,
        flowEnabled: arrow.flowEnabled !== false
      });

      state.elements.push(newArrow);
      state.splitTargetArrowId = null;
      return true;
    }

    /* -------------------------------------------------------------------------
     * 8. Auto-Fitting Multi-Line Text & Element Factory
     * ------------------------------------------------------------------------- */
    let measureCtx = null;
    function getMeasureCtx() {
      if (!measureCtx && typeof document !== 'undefined') {
        const c = document.createElement('canvas');
        measureCtx = c.getContext('2d');
      }
      return measureCtx;
    }

    function autoFitElementToText(el, text) {
      if (!el || el.type === 'arrow') return;
      el.text = text;
      const lines = String(text || '').split('\n');
      const fontSize = Number(el.fontSize) || 15;
      const lineHeight = Math.round(fontSize * EXCALIDRAW_LINE_HEIGHT);

      const mCtx = getMeasureCtx();
      let maxLineW = 0;
      if (mCtx) {
        mCtx.font = getFontCss(el.fontFamily, fontSize);
        for (const line of lines) {
          maxLineW = Math.max(maxLineW, mCtx.measureText(line || ' ').width);
        }
      } else {
        for (const line of lines) {
          maxLineW = Math.max(maxLineW, (line || '').length * fontSize * 0.58);
        }
      }

      const cx = el.x + el.width / 2;
      const cy = el.y + el.height / 2;
      let padX = 32;
      let padY = 28;
      if (el.type === 'diamond') {
        padX = Math.max(56, maxLineW * 0.65);
        padY = Math.max(44, lines.length * lineHeight * 0.65);
      } else if (el.type === 'ellipse') {
        padX = 42;
      }
      const minW = el.type === 'text' ? 40 : 110;
      const minH = el.type === 'text' ? 26 : 54;

      const nextW = Math.max(el.width || minW, minW, Math.ceil(maxLineW + padX));
      const nextH = Math.max(el.height || minH, minH, Math.ceil(lines.length * lineHeight + padY));

      if (nextW !== el.width || nextH !== el.height) {
        el.width = nextW;
        el.height = nextH;
        el.x = cx - nextW / 2;
        el.y = cy - nextH / 2;
        ShapeCache.invalidate(el);
      }
    }

    const DEFAULT_SHAPE_SIZES = {
      sticky: { width: 150, height: 110 },
      diamond: { width: 148, height: 86 },
      default: { width: 144, height: 68 }
    };

    function getDefaultShapeSize(type) {
      return DEFAULT_SHAPE_SIZES[type] || DEFAULT_SHAPE_SIZES.default;
    }

    function createElement(type, props = {}) {
      const d = state.defaults;
      const seed = props.seed || Math.floor(Math.random() * 1000000) + 1;
      const defaultSize = getDefaultShapeSize(type);
      const base = {
        id: props.id || nextId(type),
        type,
        x: props.x ?? 0,
        y: props.y ?? 0,
        width: props.width ?? defaultSize.width,
        height: props.height ?? defaultSize.height,
        strokeColor: props.strokeColor || d.strokeColor,
        fillStyle: props.fillStyle ?? (type === 'sticky' ? 'solid' : d.fillStyle),
        fontFamily: normalizeFontFamily(props.fontFamily || d.fontFamily),
        fontSize: Number(props.fontSize || d.fontSize),
        roughness: props.roughness !== undefined ? Number(props.roughness) : d.roughness,
        strokeWidth: Number(props.strokeWidth || d.strokeWidth),
        strokeStyle: props.strokeStyle || d.strokeStyle,
        curveType: props.curveType || d.curveType,
        curveOffset: Number(props.curveOffset) || 0,
        text: type === 'arrow' ? '' : (props.text ?? ''),
        seed,
        versionNonce: 1,
        flowEnabled: props.flowEnabled !== false,
        startBinding: props.startBinding || null,
        endBinding: props.endBinding || null,
        x2: props.x2,
        y2: props.y2,
        points: props.points || []
      };
      if (base.text && isNodeElement(base)) {
        autoFitElementToText(base, base.text);
      }
      return base;
    }

    /* -------------------------------------------------------------------------
     * 9. History Stack (Undo / Redo)
     * ------------------------------------------------------------------------- */
    function snapshotScene() {
      return JSON.stringify(state.elements);
    }

    function pushHistory(customSnap = null) {
      const snap = customSnap || snapshotScene();
      const stack = state.history.undoStack;
      if (stack.length > 0 && stack[stack.length - 1] === snap) return;
      stack.push(snap);
      if (stack.length > 60) stack.shift();
      state.history.redoStack = [];
      updateHeaderButtons();
    }

    function discardRedundantUndoSnapshot() {
      const stack = state.history.undoStack;
      if (stack.length > 0 && stack[stack.length - 1] === snapshotScene()) {
        stack.pop();
        updateHeaderButtons();
      }
    }

    function undo() {
      const currentSnap = snapshotScene();
      while (state.history.undoStack.length > 0 && state.history.undoStack[state.history.undoStack.length - 1] === currentSnap) {
        state.history.undoStack.pop();
      }
      if (state.history.undoStack.length === 0) {
        updateHeaderButtons();
        return;
      }
      state.history.redoStack.push(currentSnap);
      const prev = state.history.undoStack.pop();
      state.elements = JSON.parse(prev);
      state.selectedIds.clear();
      ShapeCache.clear();
      updateHeaderButtons();
      syncUIWithSelection();
    }

    function redo() {
      if (state.history.redoStack.length === 0) return;
      state.history.undoStack.push(snapshotScene());
      const next = state.history.redoStack.pop();
      state.elements = JSON.parse(next);
      state.selectedIds.clear();
      ShapeCache.clear();
      updateHeaderButtons();
      syncUIWithSelection();
    }

    /* -------------------------------------------------------------------------
     * 10. Quick-Add Chaining, Tab Chaining & Starter Templates
     * ------------------------------------------------------------------------- */
    function chainNodeFrom(sourceNode, dir = 'right', type = null, openEditor = false) {
      pushHistory();
      const targetType = type || (sourceNode.type === 'text' ? 'rectangle' : sourceNode.type);
      const stepX = 220;
      const stepY = 150;
      const scx = sourceNode.x + sourceNode.width / 2;
      const scy = sourceNode.y + sourceNode.height / 2;

      let ncx = scx + stepX;
      let ncy = scy;
      let outAngle = 0;
      let inAngle = Math.PI;

      if (dir === 'left') { ncx = scx - stepX; outAngle = Math.PI; inAngle = 0; }
      else if (dir === 'top') { ncx = scx; ncy = scy - stepY; outAngle = -Math.PI / 2; inAngle = Math.PI / 2; }
      else if (dir === 'bottom') { ncx = scx; ncy = scy + stepY; outAngle = Math.PI / 2; inAngle = -Math.PI / 2; }

      const { width: newW, height: newH } = getDefaultShapeSize(targetType);
      const newNode = createElement(targetType, {
        x: ncx - newW / 2,
        y: ncy - newH / 2,
        width: newW,
        height: newH,
        strokeColor: sourceNode.strokeColor || state.defaults.strokeColor,
        fillStyle: sourceNode.fillStyle || state.defaults.fillStyle,
        fontFamily: sourceNode.fontFamily || state.defaults.fontFamily,
        fontSize: sourceNode.fontSize || state.defaults.fontSize,
        text: 'Next Step'
      });

      const newArrow = createElement('arrow', {
        x: scx,
        y: scy,
        x2: ncx,
        y2: ncy,
        strokeColor: sourceNode.strokeColor || state.defaults.strokeColor,
        startBinding: { elementId: sourceNode.id, focusAngle: outAngle, side: dir, gap: 4 },
        endBinding: { elementId: newNode.id, focusAngle: inAngle, side: angleToSide(inAngle), gap: 4 }
      });

      state.elements.push(newNode, newArrow);
      state.selectedIds.clear();
      state.selectedIds.add(newNode.id);
      syncUIWithSelection();

      if (openEditor) {
        startInlineEditing(newNode);
      }
      return newNode;
    }

    function quickAddShape(type = 'rectangle') {
      const selectedNodes = Array.from(state.selectedIds)
        .map(id => state.elements.find(e => e.id === id))
        .filter(el => el && isNodeElement(el));

      if (selectedNodes.length === 1) {
        return chainNodeFrom(selectedNodes[0], 'right', type, false);
      }

      pushHistory();
      const vw = (typeof window !== 'undefined' ? window.innerWidth : 1280);
      const vh = (typeof window !== 'undefined' ? window.innerHeight : 800);
      const centerWorld = screenToWorld(vw / 2, vh / 2);
      const offset = (state.elements.length % 5) * 24;
      const w = type === 'sticky' ? 156 : (type === 'diamond' ? 150 : 144);
      const h = type === 'sticky' ? 114 : (type === 'diamond' ? 88 : 68);
      const defaultLabels = {
        rectangle: 'Service Node',
        ellipse: 'State / Cache',
        diamond: 'Decision?',
        sticky: 'Architecture Note'
      };
      const el = createElement(type, {
        x: centerWorld.x - w / 2 + offset,
        y: centerWorld.y - h / 2 + offset,
        width: w,
        height: h,
        text: defaultLabels[type] || 'Node'
      });
      state.elements.push(el);
      state.selectedIds.clear();
      state.selectedIds.add(el.id);
      syncUIWithSelection();
      return el;
    }

    function loadTemplate(templateName) {
      pushHistory();
      state.elements = [];
      state.selectedIds.clear();
      state.activePulses = [];
      ShapeCache.clear();

      const addNode = (id, type, x, y, w, h, text, color, fillStyle = 'hachure') => {
        const el = createElement(type, { id, x, y, width: w, height: h, text, strokeColor: color, fillStyle });
        state.elements.push(el);
        return el;
      };

      const addEdge = (fromEl, toEl, curveOffset = 0, color = null) => {
        const fc = { x: fromEl.x + fromEl.width / 2, y: fromEl.y + fromEl.height / 2 };
        const tc = { x: toEl.x + toEl.width / 2, y: toEl.y + toEl.height / 2 };
        const angOut = Math.atan2(tc.y - fc.y, tc.x - fc.x);
        const angIn = Math.atan2(fc.y - tc.y, fc.x - tc.x);
        const arr = createElement('arrow', {
          x: fc.x,
          y: fc.y,
          x2: tc.x,
          y2: tc.y,
          text: '',
          curveOffset,
          curveType: Math.abs(curveOffset) > 1 ? 'curved' : state.defaults.curveType,
          strokeColor: color || fromEl.strokeColor,
          startBinding: { elementId: fromEl.id, focusAngle: angOut, side: angleToSide(angOut), gap: 4 },
          endBinding: { elementId: toEl.id, focusAngle: angIn, side: angleToSide(angIn), gap: 4 }
        });
        state.elements.push(arr);
        return arr;
      };

      if (templateName === 'How Browsers Work') {
        const n1 = addNode('b_url', 'ellipse', 70, 220, 148, 70, 'URL Request\nHTTPS / DNS', '#0070f3');
        const n2 = addNode('b_html', 'rectangle', 295, 125, 156, 70, 'HTML Parser\nDOM Tree', '#7928ca');
        const n3 = addNode('b_css', 'rectangle', 295, 315, 156, 70, 'CSS Parser\nCSSOM', '#06b6d4');
        const n4 = addNode('b_render', 'diamond', 530, 208, 174, 96, 'Render Tree\n& Layout', '#f59e0b');
        const n5 = addNode('b_paint', 'rectangle', 780, 220, 162, 70, 'Composite &\n60fps Paint', '#10b981');
        addEdge(n1, n2, -20, '#0070f3');
        addEdge(n1, n3, 20, '#06b6d4');
        addEdge(n2, n4, 16, '#7928ca');
        addEdge(n3, n4, -16, '#06b6d4');
        addEdge(n4, n5, 0, '#10b981');
      } else if (templateName === 'RAG Pipeline') {
        const n1 = addNode('r_q', 'ellipse', 70, 225, 146, 70, 'User Query', '#0070f3');
        const n2 = addNode('r_emb', 'rectangle', 285, 225, 158, 70, 'Embedding\nEncoder', '#7928ca');
        const n3 = addNode('r_vec', 'diamond', 515, 120, 170, 94, 'Vector DB\nTop-K Search', '#06b6d4');
        const n4 = addNode('r_rerank', 'rectangle', 520, 320, 158, 70, 'Cross-Encoder\nReranker', '#f59e0b');
        const n5 = addNode('r_llm', 'rectangle', 765, 225, 164, 72, 'LLM Context\nSynthesizer', '#10b981');
        addEdge(n1, n2, 0, '#0070f3');
        addEdge(n2, n3, -18, '#7928ca');
        addEdge(n3, n4, 0, '#06b6d4');
        addEdge(n4, n5, 18, '#f59e0b');
        addEdge(n2, n5, -28, '#10b981');
      } else if (templateName === 'Microservices') {
        const n1 = addNode('m_gw', 'diamond', 70, 215, 166, 94, 'API Gateway\nRate Limiter', '#0070f3');

        const n3 = addNode('m_ord', 'rectangle', 315, 228, 152, 68, 'Order Engine', '#10b981');
        const n4 = addNode('m_pay', 'rectangle', 315, 355, 152, 68, 'Payment Worker', '#f59e0b');
        const n5 = addNode('m_kafka', 'ellipse', 565, 228, 160, 72, 'Event Bus\nKafka Stream', '#ef4444');
        const n6 = addNode('m_db', 'rectangle', 800, 228, 156, 70, 'Read Replica\nAnalytics', '#06b6d4');
        addEdge(n1, n2, -20, '#7928ca');
        addEdge(n1, n3, 0, '#0070f3');
        addEdge(n1, n4, 20, '#f59e0b');

        addEdge(n4, n5, -18, '#f59e0b');

        const n3 = addNode('a_code', 'rectangle', 530, 115, 160, 70, 'Coder Agent\nSandbox', '#10b981');
        const n4 = addNode('a_res', 'rectangle', 530, 325, 160, 70, 'Research Agent\nWeb & Docs', '#06b6d4');
        const n5 = addNode('a_ver', 'rectangle', 780, 225, 164, 70, 'Verifier Agent\nTest Runner', '#f59e0b');
        addEdge(n1, n2, 0, '#0070f3');
