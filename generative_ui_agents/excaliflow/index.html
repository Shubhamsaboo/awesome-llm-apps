<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Excaliflow — Hand-Drawn Diagramming &amp; Live Causal Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Architects+Daughter&family=Caveat:wght@500;700&family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <style>
    /* Official Excalidraw Web Fonts (Excalifont, Virgil, Cascadia) */
    @font-face {
      font-family: 'Excalifont';
      src: url('https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/fonts/Excalifont/Excalifont-Regular-a88b72a24fb54c9f94e3b5fdaa7481c9.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Virgil';
      src: url('https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw-assets/Virgil.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Cascadia';
      src: url('https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw-assets/Cascadia.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-canvas: #ffffff;
      --panel-bg: rgba(255, 255, 255, 0.94);
      --panel-border: rgba(15, 23, 42, 0.09);
      --panel-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.05);
      --text-primary: #1b1b1f;
      --text-secondary: #495057;
      --text-muted: #868e96;
      --surface-hover: #f1f0ff;
      --surface-subtle: #f8f9fa;
      --surface-active: #e0dfff;
      --accent: #6965db;
      --accent-strong: #5753d0;
      --selection-blue: #6965db;
      --danger: #e03131;
      --emerald: #10b981;
      --divider: rgba(15, 23, 42, 0.08);
      --font-sans: 'Assistant', 'Nunito', 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Cascadia', 'Geist Mono', monospace;
      --font-hand: 'Excalifont', 'Virgil', 'Patrick Hand', 'Architects Daughter', 'Caveat', cursive;
    }

    body.dark-canvas {
      --bg-canvas: #000000;
      --panel-bg: rgba(22, 22, 27, 0.92);
      --panel-border: rgba(255, 255, 255, 0.11);
      --panel-shadow: 0 8px 28px -4px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.06);
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --surface-hover: rgba(165, 162, 255, 0.12);
      --surface-subtle: rgba(255, 255, 255, 0.05);
      --surface-active: rgba(105, 101, 219, 0.28);
      --accent: #a5a2ff;
      --accent-strong: #8b87ff;
      --selection-blue: #8b87ff;
      --divider: rgba(255, 255, 255, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-canvas);
      font-family: var(--font-sans);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* Dual-Layer Retina Canvas Pipeline */
    #canvasStage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-canvas);
      transition: background-color 0.16s ease;
    }

    #staticCanvas,
    #interactiveCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #staticCanvas {
      z-index: 1;
      pointer-events: none;
    }

    #interactiveCanvas {
      z-index: 2;
      touch-action: none;
      cursor: default;
    }

    /* Clean Excaliflow Floating Islands */
    .glass-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      border: 1px solid var(--panel-border);
      box-shadow: var(--panel-shadow);
      border-radius: 10px;
      color: var(--text-primary);
    }

    /* Top Bar Layout */
    #topHeaderBar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .header-group {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      pointer-events: auto;
    }

    .brand-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 2px 8px 2px 4px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #6965db;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: var(--font-hand);
      font-size: 15px;
      font-weight: 700;
    }

    .v-divider {
      width: 1px;
      height: 20px;
      background: var(--divider);
      margin: 0 3px;
    }

    .ui-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 32px;
      padding: 0 10px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease, transform 0.08s ease;
      white-space: nowrap;
    }

    .ui-btn:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
    }

    .ui-btn:active {
      transform: scale(0.97);
    }

    .ui-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .ui-btn.active {
      background: var(--surface-active);
      color: var(--accent);
      font-weight: 600;
    }

    .ui-btn.primary {
      background: #6965db;
      color: #ffffff;
      font-weight: 600;
    }

    .ui-btn.primary:hover {
      background: #5753d0;
      color: #ffffff;
    }

    .ui-btn:disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    .ui-btn.danger:hover {
      background: rgba(224, 49, 49, 0.12);
      color: var(--danger);
    }

    /* Excaliflow Top-Center Iconic Tool Island */
    #bottomToolDock {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      pointer-events: auto;
    }

    .dock-tool-btn {
      position: relative;
      width: 36px;
      height: 36px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s ease, color 0.12s ease, transform 0.08s ease;
    }

    .dock-tool-btn svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 1.85;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .dock-tool-btn:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
    }

    .dock-tool-btn:active {
      transform: scale(0.94);
    }

    .dock-tool-btn.active {
      background: var(--surface-active);
      color: var(--accent);
    }

    .dock-key {
      position: absolute;
      bottom: 2px;
      right: 3.5px;
      font-family: var(--font-sans);
      font-size: 8.5px;
      font-weight: 600;
      opacity: 0.58;
      line-height: 1;
      pointer-events: none;
    }

    /* Master Flow Pill */
    #masterFlowPill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 4px;
    }

    .flow-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: flowPulseDot 1.8s infinite;
    }

    .flow-status-dot.paused {
      background: #94a3b8;
      box-shadow: none;
      animation: none;
    }

    @keyframes flowPulseDot {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.65); }
      70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .flow-badge-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--surface-active);
    }

    /* Dropdown Popover Menu (Export / Share & Templates) */
    .dropdown-wrap {
      position: relative;
      display: inline-flex;
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 196px;
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 35;
    }

    .dropdown-menu.align-left {
      right: auto;
      left: 0;
    }

    .dropdown-menu.open {
      display: flex;
    }

    .menu-item {
      width: 100%;
      justify-content: space-between;
      height: 31px;
      padding: 0 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    .menu-sep {
      height: 1px;
      background: var(--divider);
      margin: 4px 2px;
    }

    /* Left Properties Panel (#leftSidebar) - Clean Excaliflow Inspector */
    #leftSidebar {
      position: fixed;
      top: 64px;
      left: 12px;
      max-height: calc(100vh - 132px);
      width: 218px;
      z-index: 18;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.16s ease;
    }

    #leftSidebar.collapsed {
      transform: translateX(-240px);
      opacity: 0;
      pointer-events: none;
    }

    #leftSidebar::-webkit-scrollbar {
      width: 4px;
    }

    #leftSidebar::-webkit-scrollbar-thumb {
      background: var(--divider);
      border-radius: 4px;
    }

    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    .segmented-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(34px, 1fr));
      gap: 3px;
      background: var(--surface-subtle);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--divider);
    }

    .seg-btn {
      height: 26px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .seg-btn:hover {
      color: var(--text-primary);
      background: var(--surface-hover);
    }

    .seg-btn.active {
      background: var(--surface-active);
      color: var(--accent);
      font-weight: 600;
    }

    /* Color Swatches */
    .swatch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      padding: 2px 0;
    }

    .color-swatch {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1.5px solid rgba(0, 0, 0, 0.12);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .color-swatch:hover {
      transform: scale(1.1);
    }

    .color-swatch.active {
      box-shadow: 0 0 0 2px var(--bg-canvas), 0 0 0 3.5px var(--accent);
    }

    /* Floating Contextual Selection Toolbar (#quickHud) */
    #quickHud {
      position: fixed;
      z-index: 25;
      display: none;
      align-items: center;
      gap: 4px;
      padding: 4px 7px;
      transform: translate(-50%, -100%);
      pointer-events: auto;
      white-space: nowrap;
    }

    #quickHud.visible {
      display: inline-flex;
    }

    .hud-dot {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .hud-dot:hover,
    .hud-dot.active {
      transform: scale(1.16);
      box-shadow: 0 0 0 2px var(--accent);
    }

    /* Bottom-Left Undo/Redo & Bottom-Right Zoom Pill */
    #bottomLeftBar {
      position: fixed;
      bottom: 14px;
      left: 14px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 3px 5px;
    }

    #zoomPill {
      position: fixed;
      bottom: 14px;
      right: 14px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 3px 5px;
    }

    /* Subtle Onboarding Hint Pill */
    #canvasHintPill {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      padding: 5px 12px;
      font-size: 11.5px;
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 999px;
    }

    .hint-key {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--surface-subtle);
      border: 1px solid var(--divider);
      color: var(--text-secondary);
    }

    /* Inline Textarea Editor */
    #inlineEditorWrap {
      position: fixed;
      z-index: 30;
      display: none;
      pointer-events: auto;
    }

    #inlineTextEditor {
      min-width: 80px;
      min-height: 30px;
      padding: 4px 8px;
      border: 1.5px solid var(--accent);
      border-radius: 6px;
      background: var(--panel-bg);
      color: var(--text-primary);
      text-align: center;
      resize: none;
      outline: none;
      overflow: hidden;
      line-height: 1.3;
      box-shadow: 0 4px 16px rgba(105, 101, 219, 0.22);
    }

    /* Toast status notification */
    #studioToast {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      z-index: 40;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.18s ease;
    }

    #studioToast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <!-- Dual-Layer Retina Canvas Pipeline -->
  <div id="canvasStage">
    <canvas id="staticCanvas"></canvas>
    <canvas id="interactiveCanvas"></canvas>
  </div>

  <!-- Top Bar: Left Brand/Templates | Center Excaliflow Tool Island | Right Flow/Theme/Export -->
  <header id="topHeaderBar">
    <!-- Left Island -->
    <div class="header-group glass-panel">
      <button id="sidebarToggleBtn" class="ui-btn" title="Toggle Properties Panel (⌘\)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="brand-badge">
        <span class="brand-icon">E</span>
        <span>Excaliflow</span>
      </div>
      <div class="v-divider"></div>
      <div class="dropdown-wrap">
        <button id="templatesMenuBtn" class="ui-btn" title="Starter Architecture Templates">
          <span>Templates</span>
          <span style="font-size:9px;opacity:0.65">▾</span>
        </button>
        <div id="templatesDropdown" class="dropdown-menu align-left glass-panel">
          <button class="ui-btn menu-item" data-template="AI Agent Swarm"><span>AI Agent Swarm</span><span style="opacity:0.5">5 nodes</span></button>
          <button class="ui-btn menu-item" data-template="How Browsers Work"><span>How Browsers Work</span><span style="opacity:0.5">5 nodes</span></button>
          <button class="ui-btn menu-item" data-template="RAG Pipeline"><span>RAG Pipeline</span><span style="opacity:0.5">5 nodes</span></button>
          <button class="ui-btn menu-item" data-template="Microservices"><span>Microservices</span><span style="opacity:0.5">6 nodes</span></button>
        </div>
      </div>
    </div>

    <!-- Center Island: Iconic Excaliflow Tool Dock -->
    <nav id="bottomToolDock" class="glass-panel" aria-label="Drawing Tools">
      <button id="toolLockBtn" class="dock-tool-btn" title="Keep selected tool active after drawing (Q)">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span class="dock-key">Q</span>
      </button>
      <div class="v-divider"></div>
      <button class="dock-tool-btn active" data-tool="select" title="Selection — Move, resize, bend arrows (V or 1)">
        <svg viewBox="0 0 24 24"><path d="M4 4l7.07 17 2.51-7.39L21 11.07z"/></svg>
        <span class="dock-key">1</span>
      </button>
      <button class="dock-tool-btn" data-tool="hand" title="Hand — Pan canvas (H or Space)">
        <svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v4"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
        <span class="dock-key">H</span>
      </button>
      <button class="dock-tool-btn" data-tool="rectangle" title="Rectangle (R or 2)">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/></svg>
        <span class="dock-key">2</span>
      </button>
      <button class="dock-tool-btn" data-tool="diamond" title="Diamond / Decision (D or 3)">
        <svg viewBox="0 0 24 24"><path d="M12 3l9 9-9 9-9-9z"/></svg>
        <span class="dock-key">3</span>
      </button>
      <button class="dock-tool-btn" data-tool="ellipse" title="Ellipse / Circle (O or 4)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>
        <span class="dock-key">4</span>
      </button>
      <button class="dock-tool-btn" data-tool="arrow" title="Causal Flow Arrow (A or 5)">
        <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="9 5 19 5 19 15"/></svg>
        <span class="dock-key">5</span>
      </button>
      <button class="dock-tool-btn" data-tool="freedraw" title="Draw Freehand (P or 7)">
        <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
        <span class="dock-key">7</span>
      </button>
      <button class="dock-tool-btn" data-tool="text" title="Text (T or 8)">
        <svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        <span class="dock-key">8</span>
      </button>
      <button class="dock-tool-btn" data-tool="sticky" title="Sticky Note (N or 9)">
        <svg viewBox="0 0 24 24"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"/><polyline points="14 3 14 9 21 9"/></svg>
        <span class="dock-key">9</span>
      </button>
      <button class="dock-tool-btn" data-tool="laser" title="Laser Pointer (K)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M19.07 4.93l-2.12 2.12M7.05 16.95l-2.12 2.12"/></svg>
        <span class="dock-key">K</span>
      </button>
      <button class="dock-tool-btn" data-tool="eraser" title="Eraser (E or 0)">
        <svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
        <span class="dock-key">0</span>
      </button>
    </nav>

    <!-- Right Island: Live Flow Pill + Canvas Theme + Share/Export -->
    <div class="header-group glass-panel">
      <div id="masterFlowPill">
