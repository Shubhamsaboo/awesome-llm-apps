    /* -------------------------------------------------------------------------
     * 11. Camera Transforms & Interactive Overlay Rendering
     * ------------------------------------------------------------------------- */
    function worldToScreen(wx, wy) {
      return {
        x: (wx + state.scrollX) * state.zoom,
        y: (wy + state.scrollY) * state.zoom
      };
    }

    function screenToWorld(sx, sy) {
      return {
        x: sx / state.zoom - state.scrollX,
        y: sy / state.zoom - state.scrollY
      };
    }

    function drawInteractiveOverlay(ctx, arrowGeoms) {
      const zoom = state.zoom || 1;
      const isDark = state.canvasBg === '#000000';
      const accent = isDark ? '#8b87ff' : '#6965db';

      ctx.save();

      const elementsMap = getElementMap();

      // 1. Magnetic snap target outline, center-to-perimeter angle ray & glowing ring
      if (state.snapPreview) {
        const sp = state.snapPreview;
        const targetShape = elementsMap.get(sp.shapeId);
        if (targetShape) {
          const paths = ShapeCache.get(targetShape);
          const scx = targetShape.x + targetShape.width / 2;
          const scy = targetShape.y + targetShape.height / 2;

          ctx.save();
          ctx.strokeStyle = accent;
          ctx.lineWidth = 2.4 / zoom;
          ctx.shadowColor = accent;
          ctx.shadowBlur = 12;
          ctx.stroke(paths.fillPath);

          // Dashed radial guide from shape center to perimeter attachment point
          ctx.beginPath();
          ctx.setLineDash([4 / zoom, 4 / zoom]);
          ctx.lineWidth = 1.3 / zoom;
          ctx.globalAlpha = 0.65;
          ctx.moveTo(scx, scy);
          ctx.lineTo(sp.point.x, sp.point.y);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 1;

          // Glowing perimeter anchor ring
          ctx.beginPath();
          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = accent;
          ctx.lineWidth = 2.5 / zoom;
          ctx.arc(sp.point.x, sp.point.y, 6.5 / zoom, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }
      }

      // 2. Subtle hover cue on hovered unselected node
      if (state.hoveredId && !state.selectedIds.has(state.hoveredId) && !state.drag) {
        const hovEl = elementsMap.get(state.hoveredId);
        if (hovEl && isNodeElement(hovEl) && hovEl.type !== 'text') {
          ctx.save();
          ctx.strokeStyle = accent;
          ctx.globalAlpha = 0.35;
          ctx.lineWidth = 1.5 / zoom;
          const pad = 5 / zoom;
          ctx.strokeRect(hovEl.x - pad, hovEl.y - pad, (hovEl.width || 0) + pad * 2, (hovEl.height || 0) + pad * 2);
          ctx.restore();
        }
      }

      // 3. Selection Bounding Box + 8-Way Resize Handles + Quick-Connect '+' Ports
      const portOwnerIds = new Set(state.selectedIds);
      if (state.hoveredId) portOwnerIds.add(state.hoveredId);

      for (const id of state.selectedIds) {
        const el = elementsMap.get(id);
        if (!el || el.type === 'arrow') continue;
        ctx.save();
        ctx.strokeStyle = accent;
        ctx.lineWidth = 1.4 / zoom;
        const pad = 6 / zoom;
        ctx.strokeRect(el.x - pad, el.y - pad, (el.width || 0) + pad * 2, (el.height || 0) + pad * 2);

        // Draw 8 resize handles when single shape is selected
        if (state.selectedIds.size === 1 && isNodeElement(el) && el.type !== 'text') {
          const hs = 4.2 / zoom;
          for (const h of getResizeHandles(el)) {
            ctx.fillStyle = isDark ? '#1e1e24' : '#ffffff';
            ctx.strokeStyle = accent;
            ctx.lineWidth = 1.5 / zoom;
            ctx.beginPath();
            ctx.rect(h.x - hs, h.y - hs, hs * 2, hs * 2);
            ctx.fill();
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      if (state.activeTool === 'select') {
        for (const id of portOwnerIds) {
          const el = elementsMap.get(id);
          if (!el || !isNodeElement(el) || el.type === 'text') continue;
          const ports = getQuickConnectPorts(el);
          for (const p of ports) {
            const isHoveredPort = state.hoveredPort &&
              state.hoveredPort.elementId === el.id &&
              state.hoveredPort.dir === p.dir;
            const r = (isHoveredPort ? 9.5 : 7.2) / zoom;
            ctx.save();
            ctx.beginPath();
            ctx.fillStyle = isHoveredPort ? accent : (isDark ? '#1e1e26' : '#ffffff');
            ctx.strokeStyle = accent;
            ctx.lineWidth = 1.6 / zoom;
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            const arm = 3.3 / zoom;
            ctx.beginPath();
            ctx.strokeStyle = isHoveredPort ? '#ffffff' : accent;
            ctx.lineWidth = 1.6 / zoom;
            ctx.moveTo(p.x - arm, p.y);
            ctx.lineTo(p.x + arm, p.y);
            ctx.moveTo(p.x, p.y - arm);
            ctx.lineTo(p.x, p.y + arm);
            ctx.stroke();
            ctx.restore();
          }
        }
      }

      // 4. Hover-Visible & Selected Arrow Endpoint Handles ('start', 'curve', 'end')
      for (const el of state.elements) {
        if (el.type !== 'arrow') continue;
        const showHandles = state.selectedIds.has(el.id) || state.hoveredId === el.id ||
          (state.hoveredArrowHandle && state.hoveredArrowHandle.elementId === el.id);
        if (!showHandles) continue;

        const geom = arrowGeoms.get(el.id) || getArrowGeometry(el);
        const handles = [
          { name: 'start', pt: geom.p0, bound: Boolean(el.startBinding?.elementId) },
          ...((el.curveType || 'curved') !== 'straight' ? [{ name: 'curve', pt: geom.curveHandlePt, bound: false }] : []),
          { name: 'end',   pt: geom.p1, bound: Boolean(el.endBinding?.elementId) }
        ];

        for (const h of handles) {
          const isHot = state.hoveredArrowHandle &&
            state.hoveredArrowHandle.elementId === el.id &&
            state.hoveredArrowHandle.handle === h.name;
          const r = (isHot ? 7.4 : 5.6) / zoom;
          ctx.save();
          ctx.beginPath();
          ctx.fillStyle = h.bound ? accent : (isDark ? '#18181f' : '#ffffff');
          ctx.strokeStyle = accent;
          ctx.lineWidth = 2 / zoom;
          if (h.name === 'curve') {
            const d = r * 1.15;
            ctx.moveTo(h.pt.x, h.pt.y - d);
            ctx.lineTo(h.pt.x + d, h.pt.y);
            ctx.lineTo(h.pt.x, h.pt.y + d);
            ctx.lineTo(h.pt.x - d, h.pt.y);
            ctx.closePath();
          } else {
            ctx.arc(h.pt.x, h.pt.y, r, 0, Math.PI * 2);
          }
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }
      }

      // 5. Live Port-Wire Drag Preview
      if (state.drag && state.drag.mode === 'port-wire') {
        const d = state.drag;
        ctx.save();
        ctx.strokeStyle = accent;
        ctx.lineWidth = 2.2 / zoom;
        ctx.setLineDash([6 / zoom, 4 / zoom]);
        ctx.beginPath();
        ctx.moveTo(d.startPt.x, d.startPt.y);
        const mx = (d.startPt.x + d.currPt.x) / 2;
        const my = (d.startPt.y + d.currPt.y) / 2 - 24 / zoom;
        ctx.quadraticCurveTo(mx, my, d.currPt.x, d.currPt.y);
        ctx.stroke();
        ctx.restore();
      }

      // 6. Marquee Selection Box
      if (state.drag && state.drag.mode === 'marquee') {
        const d = state.drag;
        const x = Math.min(d.startX, d.currX);
        const y = Math.min(d.startY, d.currY);
        const w = Math.abs(d.currX - d.startX);
        const h = Math.abs(d.currY - d.startY);
        ctx.save();
        ctx.fillStyle = 'rgba(105, 101, 219, 0.09)';
        ctx.strokeStyle = accent;
        ctx.lineWidth = 1.2 / zoom;
        ctx.fillRect(x, y, w, h);
        ctx.strokeRect(x, y, w, h);
        ctx.restore();
      }

      // 7. Laser Pointer 900ms Decaying Red Glow Trail
      const nowMs = performance.now();
      state.laserPoints = state.laserPoints.filter(p => nowMs - p.t < 900);
      if (state.laserPoints.length > 1) {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        for (let i = 1; i < state.laserPoints.length; i++) {
          const p0 = state.laserPoints[i - 1];
          const p1 = state.laserPoints[i];
          const age = (nowMs - p1.t) / 900;
          const alpha = Math.max(0, 1 - age);
          ctx.beginPath();
          ctx.strokeStyle = '#ef4444';
          ctx.shadowColor = '#ef4444';
          ctx.shadowBlur = 12;
          ctx.globalAlpha = alpha;
          ctx.lineWidth = (4.5 * alpha) / zoom;
          ctx.moveTo(p0.x, p0.y);
          ctx.lineTo(p1.x, p1.y);
          ctx.stroke();
        }
        ctx.restore();
      }

      ctx.restore();
    }

    /* -------------------------------------------------------------------------
     * 12. Pointer Interaction Engine (World-Space & DOM Events)
     * ------------------------------------------------------------------------- */
    function updateInteractiveCursor() {
      if (typeof document === 'undefined') return;
      const ic = document.getElementById('interactiveCanvas');
      if (!ic) return;

      if (state.drag) {
        if (state.drag.mode === 'pan' || state.drag.mode === 'move' || state.drag.mode === 'arrow-handle') {
          ic.style.cursor = 'grabbing';
          return;
        }
        if (state.drag.mode === 'resize') {
          ic.style.cursor = state.drag.cursor || 'nwse-resize';
          return;
        }
      }

      if (state.activeTool === 'hand' || state.isSpacePanning) {
        ic.style.cursor = 'grab';
        return;
      }
      if (state.activeTool !== 'select') {
        ic.style.cursor = 'crosshair';
        return;
      }

      if (state.hoveredResizeHandle) {
        ic.style.cursor = state.hoveredResizeHandle.cursor;
      } else if (state.hoveredPort) {
        ic.style.cursor = 'pointer';
      } else if (state.hoveredArrowHandle) {
        ic.style.cursor = 'grab';
      } else if (state.hoveredId) {
        ic.style.cursor = 'move';
      } else {
        ic.style.cursor = 'default';
      }
    }

    function cloneElementsWithBindings(sourceElements, offsetX = 0, offsetY = 0) {
      if (!Array.isArray(sourceElements) || sourceElements.length === 0) return [];
      const idMap = new Map();
      const clones = [];
      for (const el of sourceElements) {
        const newId = nextId(el.type);
        idMap.set(el.id, newId);
        const copy = JSON.parse(JSON.stringify(el));
        copy.id = newId;
        copy.x = (Number(copy.x) || 0) + offsetX;
        copy.y = (Number(copy.y) || 0) + offsetY;
        if (typeof copy.x2 === 'number') copy.x2 += offsetX;
        if (typeof copy.y2 === 'number') copy.y2 += offsetY;
        copy.seed = Math.floor(Math.random() * 1000000) + 1;
        clones.push(copy);
      }
      for (const c of clones) {
        if (c.startBinding?.elementId && idMap.has(c.startBinding.elementId)) {
          c.startBinding.elementId = idMap.get(c.startBinding.elementId);
        }
        if (c.endBinding?.elementId && idMap.has(c.endBinding.elementId)) {
          c.endBinding.elementId = idMap.get(c.endBinding.elementId);
        }
        state.elements.push(c);
      }
      state.selectedIds = new Set(clones.map(c => c.id));
      return clones;
    }

    function cloneSelectedForAltDrag() {
      const selected = state.elements.filter(el => state.selectedIds.has(el.id));
      cloneElementsWithBindings(selected, 0, 0);
    }

    function pointerDownWorld(wx, wy, opts = {}) {
      if (state.editingId) commitInlineEditor();
      closeAllDropdowns();

      const shiftKey = Boolean(opts.shiftKey);
      const altKey = Boolean(opts.altKey);
      const tool = state.activeTool;

      if (tool === 'hand' || state.isSpacePanning) {
        state.drag = {
          mode: 'pan',
          startScreenX: opts.screenX ?? wx * state.zoom,
          startScreenY: opts.screenY ?? wy * state.zoom,
          origScrollX: state.scrollX,
          origScrollY: state.scrollY
        };
        updateInteractiveCursor();
        return;
      }

      if (tool === 'laser') {
        state.laserPoints.push({ x: wx, y: wy, t: performance.now() });
        state.drag = { mode: 'laser' };
        return;
      }

      if (tool === 'eraser') {
        pushHistory();
        const hit = hitTestElement(wx, wy);
        if (hit) deleteElementById(hit.id);
        state.drag = { mode: 'eraser' };
        return;
      }

      if (tool === 'freedraw') {
        pushHistory();
        const el = createElement('freedraw', {
          x: wx,
          y: wy,
          width: 1,
          height: 1,
          points: [[0, 0]]
        });
        state.elements.push(el);
        state.selectedIds.clear();
        state.selectedIds.add(el.id);
        state.drag = { mode: 'freedraw', element: el };
        return;
      }

      if (tool === 'text' || tool === 'sticky') {
        pushHistory();
        const w = tool === 'sticky' ? 156 : 120;
        const h = tool === 'sticky' ? 112 : 38;
        const el = createElement(tool, {
          x: wx - w / 2,
          y: wy - h / 2,
          width: w,
          height: h,
          text: tool === 'sticky' ? 'Sticky Note' : 'Label'
        });
        state.elements.push(el);
        state.selectedIds.clear();
        state.selectedIds.add(el.id);
        if (!state.toolLocked) setTool('select');
        syncUIWithSelection();
        startInlineEditing(el);
        return;
      }

      if (tool === 'rectangle' || tool === 'ellipse' || tool === 'diamond') {
        pushHistory();
        const el = createElement(tool, {
          x: wx,
          y: wy,
          width: 4,
          height: 4,
          text: ''
        });
        state.elements.push(el);
        state.selectedIds.clear();
        state.selectedIds.add(el.id);
        state.drag = { mode: 'draw-shape', element: el, startX: wx, startY: wy };
        return;
      }

      if (tool === 'arrow') {
        pushHistory();
        const startShape = findMagneticShape(wx, wy, null);
        const startBinding = startShape ? computeBindingForShape(startShape, { x: wx, y: wy }) : null;
        const startPt = startShape
          ? getBindingBoundaryPoint(startShape, startBinding, { x: wx, y: wy }, 4)
          : { x: wx, y: wy };

        const arrow = createElement('arrow', {
          x: startPt.x,
          y: startPt.y,
          x2: wx,
          y2: wy,
          startBinding,
          endBinding: null
        });
        state.elements.push(arrow);
        state.selectedIds.clear();
        state.selectedIds.add(arrow.id);
        state.drag = { mode: 'arrow-handle', arrow, handle: 'end', isNewArrow: true };
        return;
      }

      // SELECT MODE
      // 0. Check 8-Way Resize Handles on selected node
      const resizeHit = hitTestResizeHandles(wx, wy);
      if (resizeHit) {
        const el = state.elements.find(e => e.id === resizeHit.elementId);
        if (el) {
          pushHistory();
          state.drag = {
            mode: 'resize',
            element: el,
            dir: resizeHit.dir,
            cursor: resizeHit.cursor,
            startX: wx,
            startY: wy,
            origX: el.x,
            origY: el.y,
            origW: el.width,
            origH: el.height
          };
          updateInteractiveCursor();
          return;
        }
      }

      // 1. Check Quick-Connect '+' Ports
      const portHit = hitTestQuickPorts(wx, wy);
      if (portHit) {
        const sourceEl = state.elements.find(e => e.id === portHit.elementId);
        if (sourceEl) {
          state.drag = {
            mode: 'port-wire',
            sourceEl,
            dir: portHit.dir,
            startPt: { x: portHit.x, y: portHit.y },
            currPt: { x: wx, y: wy },
            moved: false
          };
          return;
        }
      }

      // 2. Check 1-Click Arrow Endpoint / Curve Handle Grabbing (18px / zoom radius across ALL arrows)
      const handleHit = hitTestArrowHandle(wx, wy);
      if (handleHit) {
        pushHistory();
        const arrow = state.elements.find(e => e.id === handleHit.elementId);
        if (arrow) {
          state.selectedIds.clear();
          state.selectedIds.add(arrow.id);
          syncUIWithSelection();
          state.drag = { mode: 'arrow-handle', arrow, handle: handleHit.handle };
          updateInteractiveCursor();
          return;
        }
      }

      // 3. Hit-test scene elements
      const hitEl = hitTestElement(wx, wy);
      if (hitEl) {
        pushHistory();

        if (hitEl.type === 'arrow' && !altKey) {
          const geom = getArrowGeometry(hitEl);
          const endGrabRadius = 32 / (state.zoom || 1);
          const nearStart = Math.hypot(wx - geom.p0.x, wy - geom.p0.y) <= endGrabRadius;
          const nearEnd = Math.hypot(wx - geom.p1.x, wy - geom.p1.y) <= endGrabRadius;
          const hasStartBind = Boolean(hitEl.startBinding?.elementId);
          const hasEndBind = Boolean(hitEl.endBinding?.elementId);
          const isStraight = (hitEl.curveType || 'curved') === 'straight';

          if (nearStart || nearEnd) {
            state.selectedIds.clear();
            state.selectedIds.add(hitEl.id);
            syncUIWithSelection();
            state.drag = { mode: 'arrow-handle', arrow: hitEl, handle: nearStart ? 'start' : 'end' };
            updateInteractiveCursor();
            return;
          }

          if (hasStartBind && !hasEndBind) {
            state.selectedIds.clear();
            state.selectedIds.add(hitEl.id);
            syncUIWithSelection();
            state.drag = { mode: 'arrow-handle', arrow: hitEl, handle: 'end' };
            updateInteractiveCursor();
            return;
          }

          if (!hasStartBind && hasEndBind) {
            state.selectedIds.clear();
            state.selectedIds.add(hitEl.id);
            syncUIWithSelection();
            state.drag = { mode: 'arrow-handle', arrow: hitEl, handle: 'start' };
            updateInteractiveCursor();
            return;
          }

          if (hasStartBind && hasEndBind) {
            state.selectedIds.clear();
            state.selectedIds.add(hitEl.id);
            syncUIWithSelection();
            if (!isStraight) {
              state.drag = { mode: 'arrow-handle', arrow: hitEl, handle: 'curve' };
            }
            updateInteractiveCursor();
            return;
          }
        }

        if (shiftKey) {
          if (state.selectedIds.has(hitEl.id)) state.selectedIds.delete(hitEl.id);
          else state.selectedIds.add(hitEl.id);
        } else if (!state.selectedIds.has(hitEl.id)) {
          state.selectedIds.clear();
          state.selectedIds.add(hitEl.id);
        }

        if (altKey) {
          cloneSelectedForAltDrag();
        }

        const initialPositions = new Map();
        for (const id of state.selectedIds) {
          const item = state.elements.find(e => e.id === id);
          if (item) {
            initialPositions.set(id, {
              x: item.x,
              y: item.y,
              x2: item.x2,
              y2: item.y2
            });
          }
        }
        syncUIWithSelection();
        state.drag = {
          mode: 'move',
          startX: wx,
          startY: wy,
          initialPositions
        };
        updateInteractiveCursor();
        return;
      }

      // 4. Empty Canvas -> Marquee Selection
      state.selectedIds.clear();
      syncUIWithSelection();
      state.drag = {
        mode: 'marquee',
        startX: wx,
        startY: wy,
        currX: wx,
        currY: wy
      };
    }

    function pointerMoveWorld(wx, wy, opts = {}) {
      if (!state.drag) {
        state.hoveredResizeHandle = hitTestResizeHandles(wx, wy);
        state.hoveredPort = state.hoveredResizeHandle ? null : hitTestQuickPorts(wx, wy);
        state.hoveredArrowHandle = (state.hoveredResizeHandle || state.hoveredPort) ? null : hitTestArrowHandle(wx, wy);
        const elHit = hitTestElement(wx, wy);
        state.hoveredId = elHit ? elHit.id : null;
        updateInteractiveCursor();
        return;
      }

      const d = state.drag;
      if (d.mode === 'pan') {
        const sx = opts.screenX ?? wx * state.zoom;
        const sy = opts.screenY ?? wy * state.zoom;
        state.scrollX = d.origScrollX + (sx - d.startScreenX) / state.zoom;
        state.scrollY = d.origScrollY + (sy - d.startScreenY) / state.zoom;
        updateQuickHudPosition();
        return;
      }

      if (d.mode === 'resize') {
        const el = d.element;
        const dx = wx - d.startX;
        const dy = wy - d.startY;
        const minW = 64;
        const minH = 42;
        let nx = d.origX;
        let ny = d.origY;
        let nw = d.origW;
        let nh = d.origH;

        if (d.dir.includes('e')) nw = Math.max(minW, d.origW + dx);
        if (d.dir.includes('s')) nh = Math.max(minH, d.origH + dy);
        if (d.dir.includes('w')) {
          const possibleW = d.origW - dx;
          if (possibleW >= minW) {
            nw = possibleW;
            nx = d.origX + dx;
          }
        }
        if (d.dir.includes('n')) {
          const possibleH = d.origH - dy;
          if (possibleH >= minH) {
            nh = possibleH;
            ny = d.origY + dy;
          }
        }
        el.x = nx;
        el.y = ny;
        el.width = nw;
        el.height = nh;
        ShapeCache.invalidate(el);
        updateQuickHudPosition();
        return;
      }

      if (d.mode === 'laser') {
        state.laserPoints.push({ x: wx, y: wy, t: performance.now() });
        return;
      }

      if (d.mode === 'eraser') {
        const hit = hitTestElement(wx, wy);
        if (hit) deleteElementById(hit.id);
        return;
      }

      if (d.mode === 'freedraw') {
        const el = d.element;
        el.points.push([wx - el.x, wy - el.y]);
        return;
      }

      if (d.mode === 'draw-shape') {
        const el = d.element;
        el.x = Math.min(d.startX, wx);
        el.y = Math.min(d.startY, wy);
        el.width = Math.max(24, Math.abs(wx - d.startX));
        el.height = Math.max(24, Math.abs(wy - d.startY));
        ShapeCache.invalidate(el);
        return;
      }

      if (d.mode === 'arrow-handle') {
        const arrow = d.arrow;
        if (d.handle === 'start' || d.handle === 'end') {
          const isStart = d.handle === 'start';
          const otherBinding = isStart ? arrow.endBinding : arrow.startBinding;
          const fallbackPt = isStart
            ? { x: arrow.x2 || wx, y: arrow.y2 || wy }
            : { x: arrow.x || wx, y: arrow.y || wy };
          const targetShape = findMagneticShape(wx, wy, otherBinding?.elementId || null);

          let binding = null;
          let endPt = { x: wx, y: wy };
          if (targetShape) {
            binding = computeBindingForShape(targetShape, endPt);
            endPt = getBindingBoundaryPoint(targetShape, binding, fallbackPt, 4);
            state.snapPreview = { shapeId: targetShape.id, point: endPt, angle: binding.focusAngle };
          } else {
            state.snapPreview = null;
          }

          if (otherBinding?.elementId) {
            const otherShape = state.elements.find(e => e.id === otherBinding.elementId);
            if (otherShape) {
              const ocx = otherShape.x + otherShape.width / 2;
              const ocy = otherShape.y + otherShape.height / 2;
              const angleToTarget = Math.atan2(endPt.y - ocy, endPt.x - ocx);
              if (d.isNewArrow && !isStart) {
                otherBinding.focusAngle = angleToTarget;
              } else if (!otherBinding.side && typeof otherBinding.focusAngle === 'number') {
                const diff = Math.abs(Math.atan2(
                  Math.sin(angleToTarget - otherBinding.focusAngle),
                  Math.cos(angleToTarget - otherBinding.focusAngle)
                ));
                if (diff > Math.PI * 0.52) {
                  otherBinding.focusAngle = angleToTarget;
                }
              }
            }
          }

          if (isStart) {
            arrow.startBinding = binding;
            arrow.x = endPt.x;
            arrow.y = endPt.y;
          } else {
            arrow.endBinding = binding;
            arrow.x2 = endPt.x;
            arrow.y2 = endPt.y;
          }
        } else if (d.handle === 'curve') {
          const geom = getArrowGeometry(arrow);
          const { p0, p1 } = geom;
          const mx = (p0.x + p1.x) / 2;
          const my = (p0.y + p1.y) / 2;
          if ((arrow.curveType || 'curved') === 'elbow') {
            const baseMid = geom.elbowBaseMid || { x: mx, y: my };
            arrow.curveOffset = geom.elbowAxis === 'y' ? (wy - baseMid.y) * 2 : (wx - baseMid.x) * 2;
          } else if (arrow.curveType === 'straight') {
            arrow.curveOffset = 0;
          } else {
            const chordDx = p1.x - p0.x;
            const chordDy = p1.y - p0.y;
            const chordLen = Math.hypot(chordDx, chordDy) || 1;
            const nx = -chordDy / chordLen;
            const ny = chordDx / chordLen;
            const proj = (wx - mx) * nx + (wy - my) * ny;
            arrow.curveOffset = proj * 2;
          }
        }
        updateQuickHudPosition();
        return;
      }

      if (d.mode === 'port-wire') {
        d.currPt = { x: wx, y: wy };
        if (Math.hypot(wx - d.startPt.x, wy - d.startPt.y) > 8 / (state.zoom || 1)) {
          d.moved = true;
        }
        const targetShape = findMagneticShape(wx, wy, d.sourceEl.id);
        if (targetShape) {
          const binding = computeBindingForShape(targetShape, { x: wx, y: wy });
          const bPt = getBindingBoundaryPoint(targetShape, binding, d.startPt, 4);
          state.snapPreview = { shapeId: targetShape.id, point: bPt, angle: binding.focusAngle };
        } else {
          state.snapPreview = null;
        }
        return;
      }

      if (d.mode === 'move') {
        const dx = wx - d.startX;
        const dy = wy - d.startY;
        let singleNode = null;

        for (const [id, initPos] of d.initialPositions.entries()) {
          const el = state.elements.find(e => e.id === id);
          if (!el) continue;
          el.x = initPos.x + dx;
          el.y = initPos.y + dy;
          if (el.type === 'arrow') {
            if (!el.startBinding?.elementId && typeof initPos.x === 'number') el.x = initPos.x + dx;
            if (!el.endBinding?.elementId && typeof initPos.x2 === 'number') {
              el.x2 = initPos.x2 + dx;
              el.y2 = initPos.y2 + dy;
            }
          } else {
            ShapeCache.invalidate(el);
            if (d.initialPositions.size === 1 && isNodeElement(el)) {
              singleNode = el;
            }
          }
        }

        // Re-orient unpinned bindings when connected nodes cross past each other
        for (const el of state.elements) {
          if (el.type !== 'arrow') continue;
          const sId = el.startBinding?.elementId;
          const eId = el.endBinding?.elementId;
          if (!sId && !eId) continue;
          if (!d.initialPositions.has(sId) && !d.initialPositions.has(eId)) continue;

          const sShape = sId ? state.elements.find(n => n.id === sId) : null;
          const eShape = eId ? state.elements.find(n => n.id === eId) : null;
          const sCenter = sShape
            ? { x: sShape.x + sShape.width / 2, y: sShape.y + sShape.height / 2 }
            : { x: el.x, y: el.y };
          const eCenter = eShape
            ? { x: eShape.x + eShape.width / 2, y: eShape.y + eShape.height / 2 }
            : { x: el.x2 ?? el.x, y: el.y2 ?? el.y };

          if (sShape && !el.startBinding.side && typeof el.startBinding.focusAngle === 'number') {
            const ang = Math.atan2(eCenter.y - sCenter.y, eCenter.x - sCenter.x);
            const diff = Math.abs(Math.atan2(Math.sin(ang - el.startBinding.focusAngle), Math.cos(ang - el.startBinding.focusAngle)));
            if (diff > Math.PI * 0.52) el.startBinding.focusAngle = ang;
          }
          if (eShape && !el.endBinding.side && typeof el.endBinding.focusAngle === 'number') {
            const ang = Math.atan2(sCenter.y - eCenter.y, sCenter.x - eCenter.x);
            const diff = Math.abs(Math.atan2(Math.sin(ang - el.endBinding.focusAngle), Math.cos(ang - el.endBinding.focusAngle)));
            if (diff > Math.PI * 0.52) el.endBinding.focusAngle = ang;
          }
        }

        if (singleNode) {
          const splitArrow = findSplitTargetArrow(singleNode);
          state.splitTargetArrowId = splitArrow ? splitArrow.id : null;
        } else {
          state.splitTargetArrowId = null;
        }
        updateQuickHudPosition();
        return;
      }

      if (d.mode === 'marquee') {
        d.currX = wx;
        d.currY = wy;
        const x1 = Math.min(d.startX, d.currX);
        const y1 = Math.min(d.startY, d.currY);
        const x2 = Math.max(d.startX, d.currX);
        const y2 = Math.max(d.startY, d.currY);
        state.selectedIds.clear();
        for (const el of state.elements) {
          const ex1 = el.type === 'arrow' ? Math.min(el.x, el.x2 ?? el.x) : el.x;
          const ey1 = el.type === 'arrow' ? Math.min(el.y, el.y2 ?? el.y) : el.y;
          const ex2 = el.type === 'arrow' ? Math.max(el.x, el.x2 ?? el.x) : el.x + (el.width || 0);
          const ey2 = el.type === 'arrow' ? Math.max(el.y, el.y2 ?? el.y) : el.y + (el.height || 0);
          if (ex2 >= x1 && ex1 <= x2 && ey2 >= y1 && ey1 <= y2) {
            state.selectedIds.add(el.id);
          }
        }
        syncUIWithSelection();
      }
    }

    function pointerUpWorld(wx, wy) {
      if (!state.drag) return;
      const d = state.drag;
      state.drag = null;
      state.snapPreview = null;
      updateInteractiveCursor();

      if (d.mode === 'draw-shape') {
        const el = d.element;
        if (el.width < 32 && el.height < 32) {
          el.width = el.type === 'diamond' ? 148 : 144;
          el.height = el.type === 'diamond' ? 86 : 68;
          el.text = el.type === 'diamond' ? 'Decision?' : 'Node';
          ShapeCache.invalidate(el);
        }
        if (!state.toolLocked) setTool('select');
        syncUIWithSelection();
        return;
      }

      if (d.mode === 'arrow-handle') {
        if (!state.toolLocked && state.activeTool === 'arrow') {
          setTool('select');
        }
        discardRedundantUndoSnapshot();
        syncUIWithSelection();
        return;
      }

      if (d.mode === 'port-wire') {
        if (!d.moved) {
          chainNodeFrom(d.sourceEl, d.dir, null, true);
        } else {
          pushHistory();
          const targetShape = findMagneticShape(wx, wy, d.sourceEl.id);
          const sc = { x: d.sourceEl.x + d.sourceEl.width / 2, y: d.sourceEl.y + d.sourceEl.height / 2 };
          const outAng = Math.atan2(wy - sc.y, wx - sc.x);

          if (targetShape) {
            const endBind = computeBindingForShape(targetShape, { x: wx, y: wy });
            const arr = createElement('arrow', {
              x: d.startPt.x,
              y: d.startPt.y,
              x2: wx,
              y2: wy,
              strokeColor: d.sourceEl.strokeColor,
              startBinding: { elementId: d.sourceEl.id, focusAngle: outAng, side: d.dir, gap: 4 },
              endBinding: endBind
            });
            state.elements.push(arr);
            state.selectedIds.clear();
            state.selectedIds.add(arr.id);
          } else {
            const newW = 144;
            const newH = 68;
            const newNode = createElement(d.sourceEl.type === 'text' ? 'rectangle' : d.sourceEl.type, {
              x: wx - newW / 2,
              y: wy - newH / 2,
              width: newW,
              height: newH,
              strokeColor: d.sourceEl.strokeColor,
              text: 'Connected Node'
            });
            const inAng = Math.atan2(sc.y - wy, sc.x - wx);
            const arr = createElement('arrow', {
              x: d.startPt.x,
              y: d.startPt.y,
              x2: wx,
              y2: wy,
              strokeColor: d.sourceEl.strokeColor,
              startBinding: { elementId: d.sourceEl.id, focusAngle: outAng, side: d.dir, gap: 4 },
              endBinding: { elementId: newNode.id, focusAngle: inAng, side: angleToSide(inAng), gap: 4 }
            });
            state.elements.push(newNode, arr);
            state.selectedIds.clear();
            state.selectedIds.add(newNode.id);
            startInlineEditing(newNode);
          }
          syncUIWithSelection();
        }
        return;
      }

      if (d.mode === 'move' || d.mode === 'resize') {
        if (d.mode === 'move' && state.splitTargetArrowId && state.selectedIds.size === 1) {
          const nodeId = Array.from(state.selectedIds)[0];
          const node = state.elements.find(e => e.id === nodeId);
          if (node) trySplitArrowWithNode(node);
        }
        state.splitTargetArrowId = null;
        discardRedundantUndoSnapshot();
        syncUIWithSelection();
      }
    }

    function deleteElementById(id) {
      state.elements = state.elements.filter(el => el.id !== id);
      for (const el of state.elements) {
        if (el.type === 'arrow') {
          if (el.startBinding?.elementId === id) el.startBinding = null;
          if (el.endBinding?.elementId === id) el.endBinding = null;
        }
      }
      state.selectedIds.delete(id);
      ShapeCache.invalidate(id);
      syncUIWithSelection();
    }

    function deleteSelection() {
      if (state.selectedIds.size === 0) return;
      pushHistory();
      const ids = Array.from(state.selectedIds);
      for (const id of ids) deleteElementById(id);
    }

    function duplicateSelection() {
      const selected = state.elements.filter(el => state.selectedIds.has(el.id));
      if (selected.length === 0) return [];
      pushHistory();
      const clones = cloneElementsWithBindings(selected, 28, 28);
      syncUIWithSelection();
      return clones;
    }

    /* -------------------------------------------------------------------------
     * 13. Inline Text Editor & Keyboard Shortcuts
     * ------------------------------------------------------------------------- */
    function startInlineEditing(el) {
      if (!el || el.type === 'arrow' || typeof document === 'undefined') return;
      state.editingId = el.id;
      state.editingPreSnap = snapshotScene();
      const wrap = document.getElementById('inlineEditorWrap');
      const ta = document.getElementById('inlineTextEditor');
      if (!wrap || !ta) return;

      const cx = el.x + (el.width || 0) / 2;
      const cy = el.y + (el.height || 0) / 2;

      const scr = worldToScreen(cx, cy);
      const fontSize = (Number(el.fontSize) || 16) * state.zoom;
      const w = Math.max(120, ((el.width || 120) - 12) * state.zoom);
      const h = Math.max(36, ((el.height || 44) - 8) * state.zoom);

      wrap.style.display = 'block';
      wrap.style.left = `${scr.x - w / 2}px`;
      wrap.style.top = `${scr.y - h / 2}px`;
      ta.style.width = `${w}px`;
      ta.style.height = `${h}px`;
      ta.style.fontFamily = FONT_MAP[normalizeFontFamily(el.fontFamily)];
      ta.style.fontSize = `${fontSize}px`;
      ta.style.color = resolveStrokeColor(el.strokeColor, state.canvasBg);
      ta.value = el.text || '';
      ta.focus?.();
      ta.select?.();
    }

    function commitInlineEditor() {
      if (!state.editingId) return;
      const el = state.elements.find(e => e.id === state.editingId);
      const wrap = typeof document !== 'undefined' ? document.getElementById('inlineEditorWrap') : null;
      const ta = typeof document !== 'undefined' ? document.getElementById('inlineTextEditor') : null;
      if (el && ta) {
        if (state.editingPreSnap && ta.value !== el.text) {
          pushHistory(state.editingPreSnap);
        }
        autoFitElementToText(el, ta.value);
      }
      state.editingId = null;
      state.editingPreSnap = null;
      if (wrap) wrap.style.display = 'none';
    }

    function setTool(tool) {
      state.activeTool = tool;
      if (typeof document === 'undefined') return;
      document.querySelectorAll('#bottomToolDock [data-tool]').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-tool') === tool);
      });
      updateInteractiveCursor();
    }

    function toggleToolLock(forceVal) {
      state.toolLocked = typeof forceVal === 'boolean' ? forceVal : !state.toolLocked;
      if (typeof document !== 'undefined') {
        const btn = document.getElementById('toolLockBtn');
        if (btn) btn.classList.toggle('active', state.toolLocked);
      }
      return state.toolLocked;
    }

    function handleKeyDown(e) {
      const isEditing = Boolean(state.editingId);
      if (isEditing) {
        if (e.key === 'Escape') {
          e.preventDefault?.();
          commitInlineEditor();
          return;
        }
        if (e.key === 'Tab') {
          e.preventDefault?.();
          const editedEl = state.elements.find(el => el.id === state.editingId);
          commitInlineEditor();
          if (editedEl && isNodeElement(editedEl)) {
            chainNodeFrom(editedEl, 'right', null, true);
          }
          return;
        }
        return;
      }

      if (e.key === 'Escape') {
        closeAllDropdowns();
        if (state.selectedIds.size > 0) {
          state.selectedIds.clear();
          syncUIWithSelection();
        }
        if (state.activeTool !== 'select' && !state.toolLocked) {
          setTool('select');
        }
        return;
      }

      const meta = e.metaKey || e.ctrlKey;
      const key = String(e.key || '').toLowerCase();

      if (meta && key === '\\') {
        e.preventDefault?.();
        toggleSidebar();
        return;
      }
      if (meta && key === 'z') {
        e.preventDefault?.();
        if (e.shiftKey) redo();
        else undo();
        return;
      }
      if (meta && key === 'd') {
        e.preventDefault?.();
        duplicateSelection();
        return;
      }
      if (meta && key === 'a') {
        e.preventDefault?.();
        state.selectedIds = new Set(state.elements.map(el => el.id));
        syncUIWithSelection();
        return;
      }
      if (meta && key === 'c') {
        e.preventDefault?.();
        if (e.shiftKey) {
          copy2xPng();
          return;
        }
        state.clipboard = JSON.parse(JSON.stringify(
          state.elements.filter(el => state.selectedIds.has(el.id))
        ));
        state.pasteCount = 0;
        return;
      }
      if (meta && key === 'v') {
        e.preventDefault?.();
        if (state.clipboard.length > 0) {
          pushHistory();
          state.pasteCount += 1;
          const offset = 28 * state.pasteCount;
          cloneElementsWithBindings(state.clipboard, offset, offset);
          syncUIWithSelection();
        }
        return;
      }

      if (e.key === 'Tab') {
        const selectedNodes = Array.from(state.selectedIds)
          .map(id => state.elements.find(el => el.id === id))
          .filter(el => el && isNodeElement(el));
        if (selectedNodes.length === 1) {
          e.preventDefault?.();
          chainNodeFrom(selectedNodes[0], 'right', null, true);
          return;
        }
      }

      if (e.key === 'Backspace' || e.key === 'Delete') {
        e.preventDefault?.();
        deleteSelection();
        return;
      }

      const shortcutMap = {
        '1': 'select',
        'v': 'select',
        'h': 'hand',
        '2': 'rectangle',
        'r': 'rectangle',
        '3': 'diamond',
        'd': 'diamond',
        '4': 'ellipse',
        'o': 'ellipse',
        '5': 'arrow',
        '6': 'arrow',
        'a': 'arrow',
        '7': 'freedraw',
        'p': 'freedraw',
        '8': 'text',
        't': 'text',
        '9': 'sticky',
        'n': 'sticky',
        'k': 'laser',
        '0': 'eraser',
        'e': 'eraser'
      };

      if (key === 'q') {
        e.preventDefault?.();
        toggleToolLock();
        return;
      }

      if (shortcutMap[key]) {
        e.preventDefault?.();
        setTool(shortcutMap[key]);
      }
    }

    /* -------------------------------------------------------------------------
     * 14. Studio Exports (2x Retina PNG, Clipboard, 60fps WebM Video, JSON)
     * ------------------------------------------------------------------------- */
    const ALLOWED_ELEMENT_TYPES = new Set(['rectangle', 'ellipse', 'diamond', 'arrow', 'line', 'freedraw', 'text', 'sticky']);
    const ALLOWED_FLOW_MODES = new Set(['comets', 'pulses', 'neon', 'dashed']);

    function getDiagramExportBounds(padding = 48) {
      if (state.elements.length === 0) {
        return { x: 0, y: 0, width: 800, height: 500 };
      }
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;
      const elementsMap = getElementMap();

      for (const el of state.elements) {
        if (el.type === 'arrow') {
          const geom = getArrowGeometry(el, elementsMap);
          for (const pt of geom.samples) {
            minX = Math.min(minX, pt.x);
            minY = Math.min(minY, pt.y);
            maxX = Math.max(maxX, pt.x);
            maxY = Math.max(maxY, pt.y);
          }
        } else if (el.type === 'freedraw') {
          for (const p of (el.points || [[0, 0]])) {
            minX = Math.min(minX, el.x + p[0]);
            minY = Math.min(minY, el.y + p[1]);
            maxX = Math.max(maxX, el.x + p[0]);
            maxY = Math.max(maxY, el.y + p[1]);
          }
        } else {
          minX = Math.min(minX, el.x);
          minY = Math.min(minY, el.y);
          maxX = Math.max(maxX, el.x + (el.width || 0));
          maxY = Math.max(maxY, el.y + (el.height || 0));
        }
      }

      return {
        x: Math.floor(minX - padding),
        y: Math.floor(minY - padding),
        width: Math.max(120, Math.ceil(maxX - minX + padding * 2)),
        height: Math.max(120, Math.ceil(maxY - minY + padding * 2))
      };
    }

    function renderSceneToExportCtx(offCtx, offCanvas, bounds, scale, timeSec) {
      offCtx.save();
      offCtx.fillStyle = state.canvasBg;
      offCtx.fillRect(0, 0, offCanvas.width, offCanvas.height);
      offCtx.scale(scale, scale);
      offCtx.translate(-bounds.x, -bounds.y);
      renderScenePasses(offCtx, timeSec, { canvasBg: state.canvasBg, forExport: true });
      offCtx.restore();
    }

    function renderCroppedOffscreenCanvas(scale = 2, timeSec = performance.now() / 1000) {
      const bounds = getDiagramExportBounds(48);
      const offCanvas = document.createElement('canvas');
      offCanvas.width = bounds.width * scale;
      offCanvas.height = bounds.height * scale;
      const offCtx = offCanvas.getContext('2d');
      renderSceneToExportCtx(offCtx, offCanvas, bounds, scale, timeSec);
      return offCanvas;
    }

    function downloadBlob(blob, filename) {
      if (!blob || typeof URL === 'undefined' || typeof document === 'undefined') return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function showToast(msg) {
      if (typeof document === 'undefined') return;
      const t = document.getElementById('studioToast');
      if (!t) return;
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    function save2xPng() {
      closeAllDropdowns();
      const offCanvas = renderCroppedOffscreenCanvas(2);
      offCanvas.toBlob(blob => {
        if (!blob) return;
        downloadBlob(blob, 'excaliflow-2x.png');
        showToast('Saved 2x Retina PNG (excaliflow-2x.png)');
      }, 'image/png');
    }

    async function copy2xPng() {
      closeAllDropdowns();
      const offCanvas = renderCroppedOffscreenCanvas(2);
      offCanvas.toBlob(async blob => {
        if (!blob) return;
        try {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          showToast('Copied 2x Retina PNG to Clipboard');
        } catch (err) {
          showToast('Clipboard write unavailable in this context');
        }
      }, 'image/png');
    }

    function recordWebmVideo() {
      closeAllDropdowns();
      if (state.isRecording) {
        showToast('Recording already in progress...');
        return;
      }
      if (typeof MediaRecorder === 'undefined') {
        showToast('MediaRecorder is not supported in this browser');
        return;
      }
      state.isRecording = true;
      const bounds = getDiagramExportBounds(48);
      const scale = 2;
      const offCanvas = document.createElement('canvas');
      offCanvas.width = bounds.width * scale;
      offCanvas.height = bounds.height * scale;
      const offCtx = offCanvas.getContext('2d');

      const stream = offCanvas.captureStream(60);
      const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
        ? 'video/webm;codecs=vp9'
        : 'video/webm';
      const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8_000_000 });
      const chunks = [];

      recorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };
      recorder.onerror = () => {
        state.isRecording = false;
      };
      recorder.onstop = () => {
        state.isRecording = false;
        const blob = new Blob(chunks, { type: 'video/webm' });
        downloadBlob(blob, 'excaliflow-flow.webm');
        showToast('Exported 60fps Video Loop (excaliflow-flow.webm)');
      };

      showToast('Recording 4s 60fps WebM Loop...');
      recorder.start();

      const totalFrames = 240;
      let frame = 0;
      const baseTime = performance.now() / 1000;
      const interval = setInterval(() => {
        const simTime = baseTime + frame / 60;
        renderSceneToExportCtx(offCtx, offCanvas, bounds, scale, simTime);

        frame++;
        if (frame >= totalFrames) {
          clearInterval(interval);
          recorder.stop();
        }
      }, 1000 / 60);
    }

    function exportExcalidrawJson() {
      closeAllDropdowns();
      const payload = {
        type: 'excaliflow',
        version: 2,
        source: 'Excaliflow',
        elements: state.elements,
        appState: {
          viewBackgroundColor: state.canvasBg,
          scrollX: state.scrollX,
          scrollY: state.scrollY,
          zoom: { value: state.zoom },
          flowEnabled: state.flowEnabled,
          flowMode: state.flowMode,
          flowSpeed: state.flowSpeed
        }
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      downloadBlob(blob, 'diagram.excaliflow');
      showToast('Saved diagram.excaliflow');
    }

    function importExcalidrawJson(jsonString) {
      closeAllDropdowns();
      try {
        const data = JSON.parse(jsonString);
        if (data && Array.isArray(data.elements)) {
          const validRaw = data.elements.filter(
            el => el && !el.isDeleted && typeof el.type === 'string' && ALLOWED_ELEMENT_TYPES.has(el.type)
          );
          pushHistory();
          state.elements = validRaw.map(el => {
            const normType = el.type === 'line' ? 'arrow' : el.type;
            let resolvedX2 = el.x2;
            let resolvedY2 = el.y2;
            if (normType === 'arrow' && typeof resolvedX2 !== 'number' && Array.isArray(el.points) && el.points.length > 1) {
              const lastPt = el.points[el.points.length - 1];
              if (Array.isArray(lastPt) && lastPt.length >= 2) {
                resolvedX2 = (Number(el.x) || 0) + (Number(lastPt[0]) || 0);
                resolvedY2 = (Number(el.y) || 0) + (Number(lastPt[1]) || 0);
              }
            }
            return createElement(normType, {
              ...el,
              x2: resolvedX2,
              y2: resolvedY2,
              text: normType === 'arrow' ? '' : String(el.text ?? '')
            });
          });
          if (data.appState && typeof data.appState === 'object') {
            if (data.appState.viewBackgroundColor) setCanvasBackground(data.appState.viewBackgroundColor);
            if (typeof data.appState.flowMode === 'string' && ALLOWED_FLOW_MODES.has(data.appState.flowMode)) {
              state.flowMode = data.appState.flowMode;
            }
            if (data.appState.flowSpeed !== undefined) {
              const spd = Number(data.appState.flowSpeed);
              if (Number.isFinite(spd) && spd > 0) {
                state.flowSpeed = Math.max(0.2, Math.min(5.0, spd));
              }
            }
          }
          state.selectedIds.clear();
          ShapeCache.clear();
          fitToScreen();
          syncUIWithSelection();
          showToast('Loaded Excaliflow scene');
          return true;
        }
      } catch (err) {
        showToast('Invalid JSON file');
      }
      return false;
    }

    /* -------------------------------------------------------------------------
     * 15. UI Chrome Synchronization & Viewport Controls
     * ------------------------------------------------------------------------- */
    function closeAllDropdowns() {
      if (typeof document === 'undefined') return;
      document.querySelectorAll('.dropdown-menu.open').forEach(m => m.classList.remove('open'));
    }

    function setCanvasBackground(color) {
      state.canvasBg = color === '#000000' ? '#000000' : '#ffffff';
      if (typeof document === 'undefined') return;
      document.body.classList.toggle('dark-canvas', state.canvasBg === '#000000');
      document.getElementById('bgWhiteBtn')?.classList.toggle('active', state.canvasBg === '#ffffff');
      document.getElementById('bgBlackBtn')?.classList.toggle('active', state.canvasBg === '#000000');
    }

    function syncZoomReadout() {
      if (typeof document !== 'undefined') {
        const zBtn = document.getElementById('zoomResetBtn');
        if (zBtn) zBtn.textContent = `${Math.round(state.zoom * 100)}%`;
      }
      updateQuickHudPosition();
    }

    function setZoom(nextZoom, centerScreenX, centerScreenY) {
      const clamped = Math.max(0.25, Math.min(3.0, nextZoom));
      const vw = typeof window !== 'undefined' ? window.innerWidth : 1280;
      const vh = typeof window !== 'undefined' ? window.innerHeight : 800;
      const sx = centerScreenX ?? vw / 2;
      const sy = centerScreenY ?? vh / 2;

      const worldBefore = screenToWorld(sx, sy);
      state.zoom = clamped;
      state.scrollX = sx / state.zoom - worldBefore.x;
      state.scrollY = sy / state.zoom - worldBefore.y;
      syncZoomReadout();
    }

    function fitToScreen() {
      const bounds = getDiagramExportBounds(64);
      const vw = typeof window !== 'undefined' ? window.innerWidth : 1280;
      const vh = typeof window !== 'undefined' ? window.innerHeight : 800;
      const sidebarOffset = (typeof document !== 'undefined' &&
        !document.getElementById('leftSidebar')?.classList.contains('collapsed')) ? 115 : 0;

      const availW = Math.max(320, vw - sidebarOffset - 80);
      const availH = Math.max(240, vh - 140);
      const nextZoom = Math.max(0.25, Math.min(1.5, Math.min(availW / bounds.width, availH / bounds.height)));

      state.zoom = nextZoom;
      state.scrollX = (vw + sidebarOffset) / (2 * state.zoom) - (bounds.x + bounds.width / 2);
      state.scrollY = vh / (2 * state.zoom) - (bounds.y + bounds.height / 2);
      syncZoomReadout();
    }

    function toggleSidebar() {
      if (typeof document === 'undefined') return;
      const sb = document.getElementById('leftSidebar');
      if (sb) sb.classList.toggle('collapsed');
    }

    function updateHeaderButtons() {
      if (typeof document === 'undefined') return;
      const u = document.getElementById('btnUndo');
      const r = document.getElementById('btnRedo');
      if (u) u.disabled = state.history.undoStack.length === 0;
      if (r) r.disabled = state.history.redoStack.length === 0;

      const dot = document.getElementById('flowStatusDot');
      const mBtn = document.getElementById('masterFlowBtn');
      const badge = document.getElementById('flowBadgeText');
      if (dot) dot.classList.toggle('paused', !state.flowEnabled);
      if (mBtn) {
        mBtn.textContent = state.flowEnabled ? 'Flow: ON' : 'Flow: OFF';
        mBtn.classList.toggle('active', state.flowEnabled);
      }
      if (badge) {
        badge.textContent = `${state.flowMode.toUpperCase()} · ${state.flowSpeed}X`;
      }
    }

    function updateQuickHudPosition() {
      if (typeof document === 'undefined') return;
      const hud = document.getElementById('quickHud');
      if (!hud) return;

      if (state.selectedIds.size === 0 || state.editingId) {
        hud.classList.remove('visible');
        return;
      }

      const selected = state.elements.filter(el => state.selectedIds.has(el.id));
      if (selected.length === 0) {
        hud.classList.remove('visible');
        return;
      }

      let minX = Infinity, minY = Infinity, maxX = -Infinity;
      for (const el of selected) {
        if (el.type === 'arrow') {
          const geom = getArrowGeometry(el);
          for (const p of geom.samples) {
            minX = Math.min(minX, p.x);
            minY = Math.min(minY, p.y);
            maxX = Math.max(maxX, p.x);
          }
        } else {
          minX = Math.min(minX, el.x);
          minY = Math.min(minY, el.y);
          maxX = Math.max(maxX, el.x + (el.width || 0));
        }
      }

      const topCenterScreen = worldToScreen((minX + maxX) / 2, minY);
      const clampedX = Math.max(220, Math.min(window.innerWidth - 220, topCenterScreen.x));
      const clampedY = Math.max(108, topCenterScreen.y - 18);

      hud.style.left = `${clampedX}px`;
      hud.style.top = `${clampedY}px`;
      hud.classList.add('visible');

      const first = selected[0];
      const isArrowOnly = selected.every(e => e.type === 'arrow');
      const nodeCtrls = document.getElementById('hudNodeControls');
      const arrowCtrls = document.getElementById('hudArrowControls');
      if (nodeCtrls) nodeCtrls.style.display = isArrowOnly ? 'none' : 'inline-flex';
      if (arrowCtrls) arrowCtrls.style.display = isArrowOnly ? 'inline-flex' : 'none';

      if (isArrowOnly) {
        const flowBtn = document.getElementById('hudArrowFlowBtn');
        if (flowBtn) {
          const on = first.flowEnabled !== false;
          flowBtn.textContent = on ? 'Flow ON' : 'Flow OFF';
          flowBtn.classList.toggle('active', on);
        }
      }
    }

    const STYLE_CONTROL_BINDINGS = [
      { selector: '#sidebarSwatches .color-swatch', attr: 'data-color', prop: 'strokeColor' },
      { selector: '#fillStyleRow .seg-btn', attr: 'data-fill-style', prop: 'fillStyle' },
      { selector: '#fontFamilyRow .seg-btn', attr: 'data-font-family', prop: 'fontFamily' },
      { selector: '#fontSizeRow .seg-btn', attr: 'data-font-size', prop: 'fontSize', numeric: true },
      { selector: '#roughnessRow .seg-btn', attr: 'data-roughness', prop: 'roughness', numeric: true },
      { selector: '#strokeWidthRow .seg-btn', attr: 'data-stroke-width', prop: 'strokeWidth', numeric: true },
      { selector: '#strokeStyleRow .seg-btn', attr: 'data-stroke-style', prop: 'strokeStyle' },
      { selector: '#curveTypeRow .seg-btn', attr: 'data-curve-type', prop: 'curveType' },
      { selector: '#hudFontGroup .ui-btn', attr: 'data-hud-font', prop: 'fontFamily' },
      { selector: '#hudArrowControls [data-hud-curve]', attr: 'data-hud-curve', prop: 'curveType' }
    ];

    function syncUIWithSelection() {
      if (typeof document === 'undefined') return;
      const selected = state.elements.filter(el => state.selectedIds.has(el.id));
      const ref = selected[0] || state.defaults;

      const setActiveAttr = (selector, attr, val) => {
        document.querySelectorAll(selector).forEach(btn => {
          btn.classList.toggle('active', String(btn.getAttribute(attr)) === String(val));
        });
      };

      for (const { selector, attr, prop } of STYLE_CONTROL_BINDINGS) {
        const val = prop === 'fontFamily' ? normalizeFontFamily(ref.fontFamily) : ref[prop];
        setActiveAttr(selector, attr, val);
      }
      setActiveAttr('#hudColorDots .hud-dot', 'data-color', ref.strokeColor);

      updateHeaderButtons();
      updateQuickHudPosition();
    }

    function applyStyleProperty(prop, value) {
      if (prop === 'fontFamily') value = normalizeFontFamily(value);
      state.defaults[prop] = value;
      if (prop === 'curveType' && (value === 'straight' || value === 'elbow')) {
        state.defaults.curveOffset = 0;
      }

      const targets = prop === 'roughness'
        ? state.elements
        : (state.selectedIds.size > 0
            ? state.elements.filter(el => state.selectedIds.has(el.id))
            : (prop === 'fontFamily' ? state.elements : []));

      if (targets.length > 0) {
        pushHistory();
        for (const el of targets) {
          el[prop] = value;
          if (prop === 'curveType') {
            if (value === 'straight' || value === 'elbow') {
              el.curveOffset = 0;
            } else if (value === 'curved' && Math.abs(Number(el.curveOffset) || 0) < 2) {
              el.curveOffset = -36;
            }
          }
          if (prop === 'fontFamily' || prop === 'fontSize') {
            autoFitElementToText(el, el.text);
          }
          ShapeCache.invalidate(el);
        }
      }
      syncUIWithSelection();
    }

    /* -------------------------------------------------------------------------
     * 16. DOM Wiring & 60fps Animation Loop
     * ------------------------------------------------------------------------- */
    function initStudioDOM() {
      if (typeof window === 'undefined' || typeof document === 'undefined') return;
      const staticCanvas = document.getElementById('staticCanvas');
      const interactiveCanvas = document.getElementById('interactiveCanvas');
      if (!staticCanvas || !interactiveCanvas) return;

      const hudDots = document.getElementById('hudColorDots');
      if (hudDots && hudDots.children.length === 0) {
        for (const c of SEMANTIC_COLORS) {
          const dot = document.createElement('button');
          dot.className = 'hud-dot';
          dot.style.background = c.hex;
          dot.setAttribute?.('data-color', c.hex);
          dot.title = c.name;
          dot.addEventListener('click', () => applyStyleProperty('strokeColor', c.hex));
          hudDots.appendChild(dot);
        }
      }

      const resizeCanvases = () => {
        const dpr = window.devicePixelRatio || 1;
        const w = window.innerWidth;
        const h = window.innerHeight;
        for (const c of [staticCanvas, interactiveCanvas]) {
          c.width = Math.floor(w * dpr);
          c.height = Math.floor(h * dpr);
          c.style.width = `${w}px`;
          c.style.height = `${h}px`;
        }
      };
      resizeCanvases();
      window.addEventListener('resize', resizeCanvases);

      interactiveCanvas.addEventListener('pointerdown', e => {
        interactiveCanvas.setPointerCapture?.(e.pointerId);
        const pt = screenToWorld(e.clientX, e.clientY);
        pointerDownWorld(pt.x, pt.y, {
          shiftKey: e.shiftKey,
          altKey: e.altKey,
          screenX: e.clientX,
          screenY: e.clientY
        });
      });

      interactiveCanvas.addEventListener('pointermove', e => {
        const pt = screenToWorld(e.clientX, e.clientY);
        pointerMoveWorld(pt.x, pt.y, {
          shiftKey: e.shiftKey,
          altKey: e.altKey,
          screenX: e.clientX,
          screenY: e.clientY
        });
      });

      interactiveCanvas.addEventListener('pointerup', e => {
        const pt = screenToWorld(e.clientX, e.clientY);
        pointerUpWorld(pt.x, pt.y);
      });

      interactiveCanvas.addEventListener('dblclick', e => {
        const pt = screenToWorld(e.clientX, e.clientY);
        const hit = hitTestElement(pt.x, pt.y);
        if (hit) {
          if (hit.type === 'arrow') {
            pushHistory();
            hit.curveOffset = 0;
            syncUIWithSelection();
            return;
          }
          startInlineEditing(hit);
        } else {
          pushHistory();
          const box = createElement('rectangle', {
            x: pt.x - 72,
            y: pt.y - 34,
            width: 144,
            height: 68,
            text: 'New Node'
          });
          state.elements.push(box);
          state.selectedIds.clear();
          state.selectedIds.add(box.id);
          syncUIWithSelection();
          startInlineEditing(box);
        }
      });

      interactiveCanvas.addEventListener('wheel', e => {
        e.preventDefault();
        if (e.ctrlKey || e.metaKey) {
          const factor = e.deltaY < 0 ? 1.08 : 0.92;
          setZoom(state.zoom * factor, e.clientX, e.clientY);
        } else {
          state.scrollX -= e.deltaX / state.zoom;
          state.scrollY -= e.deltaY / state.zoom;
          updateQuickHudPosition();
        }
      }, { passive: false });

      const ta = document.getElementById('inlineTextEditor');
      if (ta) {
        ta.addEventListener('input', () => {
          const el = state.elements.find(e => e.id === state.editingId);
          if (el) {
            autoFitElementToText(el, ta.value);
            const scr = worldToScreen(el.x + (el.width || 0) / 2, el.y + (el.height || 0) / 2);
            const w = Math.max(120, (el.width || 120) * state.zoom);
            const h = Math.max(36, (el.height || 44) * state.zoom);
            const wrap = document.getElementById('inlineEditorWrap');
            if (wrap) {
              wrap.style.left = `${scr.x - w / 2}px`;
              wrap.style.top = `${scr.y - h / 2}px`;
            }
            ta.style.width = `${w}px`;
            ta.style.height = `${h}px`;
          }
        });
        ta.addEventListener('blur', () => commitInlineEditor());
      }

      window.addEventListener('keydown', e => {
        if (e.code === 'Space' && !state.editingId) {
          state.isSpacePanning = true;
          updateInteractiveCursor();
        }
        handleKeyDown(e);
      });
      window.addEventListener('keyup', e => {
        if (e.code === 'Space') {
          state.isSpacePanning = false;
          updateInteractiveCursor();
        }
      });

      // Drag-and-drop .excaliflow / .excalidraw / .json scene files directly onto the window
      window.addEventListener('dragover', e => e.preventDefault?.());
      window.addEventListener('drop', e => {
        e.preventDefault?.();
        const file = e.dataTransfer?.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => importExcalidrawJson(String(ev.target?.result || ''));
        reader.readAsText(file);
      });

      // Dropdown toggles
      document.getElementById('templatesMenuBtn')?.addEventListener('click', e => {
        e.stopPropagation();
        const menu = document.getElementById('templatesDropdown');
        const wasOpen = menu?.classList.contains('open');
        closeAllDropdowns();
        if (!wasOpen) menu?.classList.add('open');
      });
      document.getElementById('exportMenuBtn')?.addEventListener('click', e => {
        e.stopPropagation();
        const menu = document.getElementById('exportDropdown');
        const wasOpen = menu?.classList.contains('open');
        closeAllDropdowns();
        if (!wasOpen) menu?.classList.add('open');
      });
      window.addEventListener('click', () => closeAllDropdowns());

      document.getElementById('sidebarToggleBtn')?.addEventListener('click', toggleSidebar);
      document.getElementById('btnUndo')?.addEventListener('click', undo);
      document.getElementById('btnRedo')?.addEventListener('click', redo);
      document.getElementById('bgWhiteBtn')?.addEventListener('click', () => setCanvasBackground('#ffffff'));
      document.getElementById('bgBlackBtn')?.addEventListener('click', () => setCanvasBackground('#000000'));

      document.getElementById('masterFlowBtn')?.addEventListener('click', () => {
        state.flowEnabled = !state.flowEnabled;
        updateHeaderButtons();
      });

      document.getElementById('btnSavePng')?.addEventListener('click', save2xPng);
      document.getElementById('btnCopyPng')?.addEventListener('click', copy2xPng);
      document.getElementById('btnRecordVideo')?.addEventListener('click', recordWebmVideo);
      document.getElementById('btnSaveJson')?.addEventListener('click', exportExcalidrawJson);
      document.getElementById('btnLoadJson')?.addEventListener('click', () => {
        document.getElementById('jsonFileInput')?.click();
      });
      document.getElementById('jsonFileInput')?.addEventListener('change', e => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => importExcalidrawJson(String(ev.target?.result || ''));
        reader.readAsText(file);
        e.target.value = '';
      });
      document.getElementById('btnClearScene')?.addEventListener('click', () => {
        closeAllDropdowns();
        pushHistory();
        state.elements = [];
        state.selectedIds.clear();
        ShapeCache.clear();
        syncUIWithSelection();
      });

      document.querySelectorAll('[data-quick-add]').forEach(btn => {
        btn.addEventListener('click', () => quickAddShape(btn.getAttribute('data-quick-add')));
      });

      document.querySelectorAll('#flowModeGrid [data-flow-mode]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.flowMode = btn.getAttribute('data-flow-mode');
          document.querySelectorAll('#flowModeGrid [data-flow-mode]').forEach(b => {
            b.classList.toggle('active', b === btn);
          });
          updateHeaderButtons();
        });
      });

      document.querySelectorAll('#flowSpeedRow [data-flow-speed]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.flowSpeed = Number(btn.getAttribute('data-flow-speed')) || 1;
          document.querySelectorAll('#flowSpeedRow [data-flow-speed]').forEach(b => {
            b.classList.toggle('active', b === btn);
          });
          updateHeaderButtons();
        });
      });

      for (const { selector, attr, prop, numeric } of STYLE_CONTROL_BINDINGS) {
        document.querySelectorAll(selector).forEach(btn => {
          btn.addEventListener('click', () => {
            const raw = btn.getAttribute(attr);
            applyStyleProperty(prop, numeric ? Number(raw) : raw);
          });
        });
      }

      document.querySelectorAll('[data-template]').forEach(btn => {
        btn.addEventListener('click', () => {
          closeAllDropdowns();
          loadTemplate(btn.getAttribute('data-template'));
        });
      });

      document.querySelectorAll('#hudNodeControls [data-hud-morph]').forEach(btn => {
        btn.addEventListener('click', () => {
          const newType = btn.getAttribute('data-hud-morph');
          pushHistory();
          for (const id of state.selectedIds) {
            const el = state.elements.find(e => e.id === id);
            if (el && isNodeElement(el)) {
              el.type = newType;
              autoFitElementToText(el, el.text);
              ShapeCache.invalidate(el);
            }
          }
          syncUIWithSelection();
        });
      });
      document.getElementById('hudPulseBtn')?.addEventListener('click', () => triggerNodePulse());
      document.getElementById('hudNextBtn')?.addEventListener('click', () => {
        const firstId = Array.from(state.selectedIds)[0];
        const el = state.elements.find(e => e.id === firstId);
        if (el && isNodeElement(el)) chainNodeFrom(el, 'right', null, true);
      });
      document.getElementById('hudArrowFlowBtn')?.addEventListener('click', () => {
        pushHistory();
        for (const id of state.selectedIds) {
          const el = state.elements.find(e => e.id === id);
          if (el && el.type === 'arrow') el.flowEnabled = el.flowEnabled === false;
        }
        syncUIWithSelection();
      });
      document.getElementById('hudFlipArrowBtn')?.addEventListener('click', () => {
        pushHistory();
        for (const id of state.selectedIds) {
          const el = state.elements.find(e => e.id === id);
          if (el && el.type === 'arrow') {
            const tmpBind = el.startBinding;
            el.startBinding = el.endBinding;
            el.endBinding = tmpBind;
            const tx = el.x, ty = el.y;
            el.x = el.x2; el.y = el.y2;
            el.x2 = tx; el.y2 = ty;
            el.curveOffset = -(Number(el.curveOffset) || 0);
          }
        }
        syncUIWithSelection();
      });
      document.getElementById('hudDuplicateBtn')?.addEventListener('click', duplicateSelection);
      document.getElementById('hudDeleteBtn')?.addEventListener('click', deleteSelection);

      document.getElementById('toolLockBtn')?.addEventListener('click', () => toggleToolLock());
      document.querySelectorAll('#bottomToolDock [data-tool]').forEach(btn => {
        btn.addEventListener('click', () => setTool(btn.getAttribute('data-tool')));
      });

      document.getElementById('zoomOutBtn')?.addEventListener('click', () => setZoom(state.zoom * 0.85));
      document.getElementById('zoomInBtn')?.addEventListener('click', () => setZoom(state.zoom * 1.15));
      document.getElementById('zoomResetBtn')?.addEventListener('click', () => setZoom(1.0));
      document.getElementById('zoomFitBtn')?.addEventListener('click', fitToScreen);

      // Warm up official Excalidraw web fonts (Excalifont, Virgil, Cascadia, Assistant)
      if (document.fonts && document.fonts.load) {
        Promise.allSettled([
          document.fonts.load('16px Excalifont'),
          document.fonts.load('16px Virgil'),
          document.fonts.load('16px Cascadia'),
          document.fonts.load('500 16px Assistant')
        ]);
      }

      loadTemplate('AI Agent Swarm');
      state.history.undoStack = [];
      updateHeaderButtons();

      let lastFrameTime = performance.now() / 1000;
      const tick = (nowMs) => {
        const timeSec = nowMs / 1000;
        const dt = Math.min(0.05, Math.max(0.001, timeSec - lastFrameTime));
        lastFrameTime = timeSec;

        for (let i = state.activePulses.length - 1; i >= 0; i--) {
          const p = state.activePulses[i];
          p.progress += dt * (p.speed || 1.35);
          if (p.progress > 1.05) {
            state.activePulses.splice(i, 1);
          }
        }

        const dpr = window.devicePixelRatio || 1;
        const sCtx = staticCanvas.getContext('2d');
        const iCtx = interactiveCanvas.getContext('2d');

        sCtx.save();
        sCtx.setTransform(1, 0, 0, 1, 0, 0);
        sCtx.fillStyle = state.canvasBg;
        sCtx.fillRect(0, 0, staticCanvas.width, staticCanvas.height);
        sCtx.scale(dpr * state.zoom, dpr * state.zoom);
        sCtx.translate(state.scrollX, state.scrollY);
        const arrowGeoms = renderScenePasses(sCtx, timeSec, { canvasBg: state.canvasBg });
        sCtx.restore();

        iCtx.save();
        iCtx.setTransform(1, 0, 0, 1, 0, 0);
        iCtx.clearRect(0, 0, interactiveCanvas.width, interactiveCanvas.height);
        iCtx.scale(dpr * state.zoom, dpr * state.zoom);
        iCtx.translate(state.scrollX, state.scrollY);
        drawInteractiveOverlay(iCtx, arrowGeoms);
        iCtx.restore();

        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    if (typeof window !== 'undefined') {
      Object.assign(window, {
        state,
        mulberry32,
        clipSegmentToShape,
        clampPointToShapeInterior,
        roughEdge,
        roughRoundRect,
        roughEllipse,
        ShapeCache,
        drawStaticElement,
        drawElementText,
        computeGraphDepths,
        triggerNodePulse,
        getArrowGeometry,
        computeBindingForShape,
        getBindingBoundaryPoint,
        findMagneticShape,
        hitTestArrowHandle,
        hitTestQuickPorts,
        hitTestElement,
        autoFitElementToText,
        findSplitTargetArrow,
        trySplitArrowWithNode,
        getDiagramExportBounds,
        renderScenePasses,
        pointerDownWorld,
        pointerMoveWorld,
        pointerUpWorld,
        handleKeyDown,
        setTool,
        toggleToolLock,
        loadTemplate,
        quickAddShape,
        createElement,
        cloneElementsWithBindings,
        undo,
        redo,
        importExcalidrawJson,
