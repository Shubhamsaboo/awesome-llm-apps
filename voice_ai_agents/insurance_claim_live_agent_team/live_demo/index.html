<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Insurance Claim Live Agent Team</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Patrick+Hand&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=notebook-1" />
  </head>
  <body>
    <div class="desk">
      <header class="desk-bar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>Insurance Claim Live Agent Team</h1>
            <p id="modelLabel" class="brand-sub">Connecting to Gemini</p>
          </div>
        </div>
        <button id="openPacket" class="ghost-button" type="button">Adjuster packet</button>
      </header>

      <main class="desk-layout">
        <aside class="side">
          <section class="card call-card">
            <div class="card-head">
              <span class="card-kicker">Live call</span>
              <span id="callStatus" class="pill">Connecting</span>
            </div>

            <div class="controls">
              <button id="micButton" class="round-button" type="button" aria-label="Start live voice">
                <span class="icon-mic" aria-hidden="true"></span>
                <span class="round-label">Talk</span>
              </button>
              <button id="cameraButton" class="round-button" type="button" aria-label="Show the damage on camera">
                <span class="icon-camera" aria-hidden="true"></span>
                <span class="round-label">Show camera</span>
              </button>
              <button id="newIntakeButton" class="round-button subtle" type="button" aria-label="Start a new intake">
                <span class="icon-new" aria-hidden="true"></span>
                <span class="round-label">New intake</span>
              </button>
            </div>

            <div id="cameraStage" class="camera-stage" hidden>
              <video id="cameraPreview" autoplay muted playsinline></video>
              <span class="camera-tag"><span class="rec-dot" aria-hidden="true"></span> Agent is watching</span>
            </div>

            <div id="transcript" class="transcript" aria-live="polite"></div>

            <form id="textForm" class="text-entry">
              <input
                id="textInput"
                type="text"
                autocomplete="off"
                placeholder="Or type what the claimant says..."
                aria-label="Type a claimant response"
              />
              <button type="submit">Send</button>
            </form>
          </section>

          <section class="card needed-card">
            <div class="card-head">
              <span class="card-kicker">Still needed</span>
              <span id="readiness" class="pill neutral">0% ready</span>
            </div>
            <ul id="neededList" class="needed-list"></ul>
          </section>

          <section class="card team-card">
            <div class="card-head">
              <span class="card-kicker">Claim team</span>
              <span class="card-hint">Working in the background while the call continues</span>
            </div>
            <ul id="teamFeed" class="team-feed"></ul>
          </section>
        </aside>

        <section class="notebook-wrap" aria-label="Field notebook">
          <div class="notebook">
            <div class="holes" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="page-head">
              <span id="pageDate">Claim intake notes</span>
              <span id="pageAgent">Gemini 3.8 Live, field notes</span>
            </div>
            <div id="notes" class="notes"></div>
            <div id="pinboard" class="pinboard"></div>
            <div id="stamp" class="stamp" hidden></div>
            <div id="pen" class="pen" hidden><span class="pen-nib" aria-hidden="true"></span> writing</div>
          </div>
        </section>
      </main>
    </div>

    <dialog id="packetDialog" class="packet-dialog">
      <div class="dialog-header">
        <h2>Adjuster handoff packet</h2>
        <button id="closePacket" type="button" aria-label="Close packet">Close</button>
      </div>
      <pre id="packetMarkdown"></pre>
    </dialog>

    <canvas id="frameCanvas" hidden></canvas>
    <script src="./app.js?v=notebook-1"></script>
  </body>
</html>
